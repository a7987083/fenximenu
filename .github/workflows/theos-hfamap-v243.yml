name: HFAMapUniversal v2.4.3 Generic Secret Observer

on:
  push:
    branches:
      - feature/hfamap-v2.4.3-generic-secret-native-hook
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - '.github/workflows/theos-hfamap-v243.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source contract tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build arm64 dylib
        working-directory: hfamap
        run: |
          export THEOS=$HOME/theos
          make clean
          make FINALPACKAGE=1
          mkdir -p dist/v2.4.3-dev
          find .theos -type f -name 'HFAMapUniversal.dylib' -print -exec cp {} dist/v2.4.3-dev/HFAMapUniversal-v2.4.3-dev.dylib \;
          test -s dist/v2.4.3-dev/HFAMapUniversal-v2.4.3-dev.dylib
          shasum -a 256 dist/v2.4.3-dev/HFAMapUniversal-v2.4.3-dev.dylib
          file dist/v2.4.3-dev/HFAMapUniversal-v2.4.3-dev.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.4.3-dev
          path: hfamap/dist/v2.4.3-dev/HFAMapUniversal-v2.4.3-dev.dylib
          if-no-files-found: error
