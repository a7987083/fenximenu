name: HFAMapUniversal v2.4.3 Generic Secret Observer

on:
  push:
    branches:
      - feature/hfamap-v2.4.3-generic-secret-native-hook
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - '.github/workflows/theos-hfamap-v243.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source contract tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build, sign and verify arm64 dylib
        working-directory: hfamap
        run: |
          set -euo pipefail
          export THEOS=$HOME/theos
          make clean
          make FINALPACKAGE=1

          mkdir -p dist/v2.4.3-dev
          src="$(find .theos -type f -name 'HFAMapUniversal.dylib' -print -quit)"
          test -n "$src"
          cp "$src" dist/v2.4.3-dev/HFAMapUniversal-v2.4.3-dev.dylib

          out="dist/v2.4.3-dev/HFAMapUniversal-v2.4.3-dev.dylib"
          test -s "$out"

          # The artifact is a standalone injectable dylib. Explicitly ad-hoc sign
          # the copied output instead of assuming an intermediate .theos product
          # already carries a signature.
          ldid -S "$out"

          file "$out" | grep -q 'Mach-O 64-bit dynamically linked shared library arm64'
          otool -l "$out" | grep -q 'LC_CODE_SIGNATURE'

          echo '=== CODE SIGNATURE LOAD COMMAND ==='
          otool -l "$out" | grep -A4 'LC_CODE_SIGNATURE'
          echo '=== SHA256 ==='
          shasum -a 256 "$out"
          echo '=== FILE ==='
          file "$out"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.4.3-dev-signed
          path: hfamap/dist/v2.4.3-dev/HFAMapUniversal-v2.4.3-dev.dylib
          if-no-files-found: error
