name: ZPatchIG v0.1 build
on:
  push:
    branches: [zpatchig]
    paths:
      - 'hfamap/**'
      - '.github/workflows/zpatchig-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Static source gates
        run: |
          set -euo pipefail
          grep -q 'descriptorInstanceSize' hfamap/src/ZPImageProbe.mm
          grep -q 'C4M0Manager' hfamap/src/ZPResolver.mm
          grep -q 'v0.1-does-not-export-unverified-patches' hfamap/src/ZPResolver.mm
          if grep -R -n 'MSHookFunction\|DobbyHook\|mach_vm_write' hfamap/src; then
            echo 'v0.1 must stay parser/exporter-only'; exit 1
          fi
      - name: Install dependencies
        run: brew install ldid
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build
        run: |
          set -euo pipefail
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          cp .theos/obj/ZPatchIG.dylib dist/ZPatchIG_v0.1.0.dylib
          file dist/ZPatchIG_v0.1.0.dylib | tee dist/file.txt
          shasum -a 256 dist/ZPatchIG_v0.1.0.dylib | tee dist/SHA256.txt
          strings dist/ZPatchIG_v0.1.0.dylib > dist/strings.txt
          grep -q 'ZPatchIG v0.1 Analyzer' dist/strings.txt
          grep -q 'v0.1-does-not-export-unverified-patches' dist/strings.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZPatchIG-v0.1.0
          path: |
            hfamap/dist/ZPatchIG_v0.1.0.dylib
            hfamap/dist/SHA256.txt
            hfamap/dist/file.txt
          if-no-files-found: error
