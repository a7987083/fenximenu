name: ZPatchIG v0.2 build
on:
  push:
    branches: [zpatchig]
    paths: ['hfamap/**','.github/workflows/zpatchig-build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Static source gates
        run: |
          set -euo pipefail
          grep -q 'legacy-descriptor-abi' hfamap/src/ZPImageProbe.mm
          grep -q 'ZPDescriptorObserverArm' hfamap/src/ZPDescriptorObserver.mm
          grep -q 'method_setImplementation' hfamap/src/ZPDescriptorObserver.mm
          grep -q 'window-expired' hfamap/src/ZPDescriptorObserver.mm
          grep -q 'CFBundleDisplayName' hfamap/src/ZPAppIdentity.mm
          grep -q 'CFBundleName' hfamap/src/ZPAppIdentity.mm
          grep -q 'ZPLogFilename(@"Process.jsonl")' hfamap/src/HFAMapCore.mm
          grep -q 'ZPLogFilename(@"Diagnostics.jsonl")' hfamap/src/HFAMapDiagnostics.mm
          if grep -R -n 'MSHookFunction\|DobbyHook\|mach_vm_write' hfamap/src; then echo 'v0.2 must not contain patch execution'; exit 1; fi
      - name: Filename policy regression
        run: |
          python3 - <<'PY'
          import re
          def safe(v):
              out=[]; last=False
              for c in v[:200]:
                  if len(out)>=96: break
                  if re.match(r'[A-Za-z0-9._-]',c): out.append(c); last=False
                  elif not last: out.append('_'); last=True
              return ''.join(out).strip('_') or 'unknown'
          assert safe('com.example.game')=='com.example.game'
          assert safe('Backpack Brawl')=='Backpack_Brawl'
          assert safe('A/B:C*D?')=='A_B_C_D'
          PY
      - name: Install dependencies
        run: brew install ldid
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build
        run: |
          set -euo pipefail
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          cp .theos/obj/ZPatchIG.dylib dist/ZPatchIG_v0.2.0.dylib
          file dist/ZPatchIG_v0.2.0.dylib | tee dist/file.txt
          shasum -a 256 dist/ZPatchIG_v0.2.0.dylib | tee dist/SHA256.txt
          strings dist/ZPatchIG_v0.2.0.dylib > dist/strings.txt
          grep -q 'ZPatchIG v0.2 Descriptor Observer' dist/strings.txt
          grep -q 'DescriptorEvents.jsonl' dist/strings.txt
          grep -q 'CFBundleIdentifier' dist/strings.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZPatchIG-v0.2.0
          path: |
            hfamap/dist/ZPatchIG_v0.2.0.dylib
            hfamap/dist/SHA256.txt
            hfamap/dist/file.txt
          if-no-files-found: error
