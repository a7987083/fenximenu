name: ZPatchIG v0.3 build
on:
  push:
    branches: [zpatchig]
    paths: ['hfamap/**','.github/workflows/zpatchig-build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Static source gates
        run: |
          set -euo pipefail
          grep -q 'legacy-descriptor-abi' hfamap/src/ZPImageProbe.mm
          grep -q 'ZPDescriptorObserverArm' hfamap/src/ZPDescriptorObserver.mm
          grep -q 'ZPFeatureResolverCollect' hfamap/src/ZPFeatureResolver.mm
          grep -q 'ZPFeatureForIdentifier' hfamap/src/ZPDescriptorObserver.mm
          grep -q 'ZPLegacyOffsetResolverSchedule' hfamap/src/ZPDescriptorObserver.mm
          grep -q 'decryptFingerprintMatches' hfamap/src/ZPLegacyOffsetResolver.mm
          grep -q 'unique-current-image-fingerprint-plus-numeric-plaintext' hfamap/src/ZPLegacyOffsetResolver.mm
          grep -q 'CFBundleDisplayName' hfamap/src/ZPAppIdentity.mm
          grep -q 'CFBundleName' hfamap/src/ZPAppIdentity.mm
          grep -q 'ZPLogFilename(@"OffsetEvents.jsonl")' hfamap/src/ZPLegacyOffsetResolver.mm
          if grep -R -n 'MSHookFunction\|DobbyHook\|mach_vm_write' hfamap/src; then echo 'v0.3 must not contain patch execution'; exit 1; fi
          if grep -R -nE 'getter[[:space:]]*\+[[:space:]]*0xD00|getterAddress[[:space:]]*\+[[:space:]]*0xD00' hfamap/src; then echo 'fixed historical decrypt delta is forbidden'; exit 1; fi
      - name: Feature correlation regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path('hfamap/src/ZPFeatureResolver.mm').read_text()
          o=Path('hfamap/src/ZPDescriptorObserver.mm').read_text()
          assert 'currentTitle' in f and 'accessibilityLabel' in f and 'titleLabel' in f
          assert 'control-target' in f
          assert 'ZPFeatureForIdentifier' in o
          assert 'descriptor-event/v3' in o
          print('feature correlation gates passed')
          PY
      - name: Offset evidence regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('hfamap/src/ZPLegacyOffsetResolver.mm').read_text()
          assert 'ZPTextRangeForBase' in s
          assert 'ZPFindDecryptCandidates' in s
          assert '0xD105C3FFu' in s
          assert '0xB9400408u' in s
          assert '0x53187D00u' in s
          assert 'candidates.count!=1' in s
          assert 'decrypt-succeeded-non-numeric-plaintext' in s
          assert 'getter+0xD00' not in s.replace(' ','')
          print('offset evidence gates passed')
          PY
      - name: Observer safety regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('hfamap/src/ZPDescriptorObserver.mm').read_text()
          assert 'ZPDirectMethod' in s
          assert "if(rc!='v')" in s
          assert 'gZPObservedEventCount' in s
          assert 'HFADiagnosticsLog(@"descriptor-observer",@"event"' not in s
          print('observer safety gates passed')
          PY
      - name: Install dependencies
        run: brew install ldid
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build
        run: |
          set -euo pipefail
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          cp .theos/obj/ZPatchIG.dylib dist/ZPatchIG_v0.3.0.dylib
          file dist/ZPatchIG_v0.3.0.dylib | tee dist/file.txt
          shasum -a 256 dist/ZPatchIG_v0.3.0.dylib | tee dist/SHA256.txt
          strings dist/ZPatchIG_v0.3.0.dylib > dist/strings.txt
          grep -q 'ZPatchIG v0.3 Analyzer' dist/strings.txt
          grep -q 'OffsetEvents.jsonl' dist/strings.txt
          grep -q 'descriptor-event/v3' dist/strings.txt
          grep -q 'unique-current-image-fingerprint-plus-numeric-plaintext' dist/strings.txt
          grep -q 'CFBundleIdentifier' dist/strings.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZPatchIG-v0.3.0
          path: |
            hfamap/dist/ZPatchIG_v0.3.0.dylib
            hfamap/dist/SHA256.txt
            hfamap/dist/file.txt
          if-no-files-found: error
