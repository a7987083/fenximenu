name: H5GG Float Smoke

on:
  push:
    branches:
      - test/h5gg-float-smoke-v1
    paths:
      - 'experiments/h5gg-float-smoke/**'
      - '.github/workflows/h5gg-float-smoke.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find clang

      - name: Build arm64 dylib
        run: |
          set -euxo pipefail
          mkdir -p build/h5gg-float-smoke
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDKROOT" \
            -miphoneos-version-min=13.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -framework CoreGraphics \
            -framework Security \
            -install_name @rpath/H5GGCardAuthV5.dylib \
            -o build/h5gg-float-smoke/H5GGCardAuthV5.dylib \
            experiments/h5gg-float-smoke/H5GGFloatSmoke.m \
            experiments/h5gg-float-smoke/ZONDylibConfig.m \
            experiments/h5gg-float-smoke/ZONDylibVerify.m
          codesign --force --sign - build/h5gg-float-smoke/H5GGCardAuthV5.dylib
          file build/h5gg-float-smoke/H5GGCardAuthV5.dylib
          xcrun vtool -show-build build/h5gg-float-smoke/H5GGCardAuthV5.dylib
          shasum -a 256 build/h5gg-float-smoke/H5GGCardAuthV5.dylib | tee build/h5gg-float-smoke/SHA256.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: H5GGCardAuthV5-arm64-ios13
          path: build/h5gg-float-smoke/
          if-no-files-found: error
          retention-days: 7
