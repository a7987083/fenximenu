name: HFARuntimeAnalyzer v0.3.11 ADRFullTextXrefConsumer

on:
  push:
    branches: [feature/hfaruntime-v0.3.11-adr-fulltext-xref-consumer]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate and verify
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_hfaruntime_v0311_chain.py
          python3 -m py_compile \
            .github/scripts/apply_hfaruntime_v0311_chain.py \
            .github/scripts/hfamap_runtime_analyzer_v0311_adr_block_nested.py \
            .github/scripts/hfamap_runtime_analyzer_v0311_notification_prefilter.py \
            .github/scripts/hfamap_runtime_analyzer_v0311_fulltext_xref.py \
            .github/scripts/hfamap_runtime_analyzer_v0311_consumer_graph.py
          SRC=hfamap/src/HFAMapRuntimeAnalyzerV02.m
          DIS=hfamap/src/HFAMap5MDispatcherResolver.m
          grep -Fq 'HFA0311ResolveNearbyBlockInvoke' "$DIS"
          grep -Fq '[V0311-BLOCK-INVOKE]' "$DIS"
          grep -Fq '[V0311-NOTIFY-XREF]' "$DIS"
          grep -Fq 'HFAV0311FullTextStateXrefCandidates' "$SRC"
          grep -Fq '[V0311-STATE-XREF]' "$SRC"
          grep -Fq 'HFAV0311ConsumerGraph' "$SRC"
          grep -Fq '[V0311-CONSUMER-GRAPH]' "$SRC"
          grep -Fq '[V0311-SCAN-END]' "$SRC"
          grep -Fq 'HFAMap_RuntimeAnalyzer_v0311.json' "$SRC"
          grep -Fq 'com.hfa.runtime-analyzer/v0.3.11' "$SRC"
          if grep -Eq '0x2D98AC8|0x2D9887C|0x2E25904' .github/scripts/hfamap_runtime_analyzer_v0311_*.py; then echo 'FIXED RVA LEAKED INTO V0311 GENERIC LAYER'; exit 1; fi
          if grep -Eiq 'Duck Survival|Aniimo|ProDragon|Dragon Fever|Random Dice|RogueLegend|Path of Kings' .github/scripts/hfamap_runtime_analyzer_v0311_*.py; then echo 'SAMPLE NAME LEAKED INTO V0311 GENERIC LAYER'; exit 1; fi
          git diff --check
      - name: Install dependencies
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Build
        run: |
          set -euo pipefail
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out=dist/HFARuntimeAnalyzer-v0.3.11-ADRFullTextXrefConsumer.dylib
          cp .theos/obj/HFAMapUniversal.dylib "$out"
          file "$out"
          shasum -a 256 "$out" | tee dist/SHA256_HFARuntimeAnalyzer-v0.3.11-ADRFullTextXrefConsumer.txt
          strings "$out" | grep -q 'V0311-BLOCK-INVOKE'
          strings "$out" | grep -q 'V0311-NOTIFY-XREF'
          strings "$out" | grep -q 'V0311-STATE-XREF'
          strings "$out" | grep -q 'V0311-CONSUMER-GRAPH'
          strings "$out" | grep -q 'V0311-SCAN-END'
          strings "$out" | grep -q 'com.hfa.runtime-analyzer/v0.3.11'
      - uses: actions/upload-artifact@v4
        with:
          name: HFARuntimeAnalyzer-v0.3.11-ADRFullTextXrefConsumer
          path: |
            hfamap/dist/HFARuntimeAnalyzer-v0.3.11-ADRFullTextXrefConsumer.dylib
            hfamap/dist/SHA256_HFARuntimeAnalyzer-v0.3.11-ADRFullTextXrefConsumer.txt
          if-no-files-found: error
