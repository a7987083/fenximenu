name: HFAMap v2.5.13 Reference Feature Enumerator

on:
  push:
    branches:
      - feature/hfamap-v2.5.13-reference-feature-enumerator
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - '.github/workflows/theos-hfamap-v2.5.13-reference-feature-enumerator.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tests/*.py
      - name: Check v2.5.13 invariants
        run: |
          set -euo pipefail
          grep -q 'src/HFAMapLoadedMenuFeatureEnumerator.mm' hfamap/Makefile
          grep -q 'src/HFAMapVersion2513.mm' hfamap/Makefile
          grep -q 'REFERENCE-INSPIRED-READ-ONLY-UI-PATCH-BLOCK-MULTIPATH' hfamap/src/HFAMapLoadedMenuFeatureEnumerator.mm
          grep -q 'com.hfa.loaded-menu-feature-inventory/v1' hfamap/src/HFAMapLoadedMenuFeatureEnumerator.mm
          grep -q 'LoadedMenuFeatureInventory.json' hfamap/src/HFAMapLoadedMenuFeatureEnumerator.mm
          grep -q 'objcSuperclassMethodFingerprint' hfamap/src/HFAMapLoadedMenuFeatureEnumerator.mm
          grep -q 'blockInvokeInventory' hfamap/src/HFAMapLoadedMenuFeatureEnumerator.mm
          grep -q 'managerPatchObjectShapeInventory' hfamap/src/HFAMapLoadedMenuFeatureEnumerator.mm
          ! grep -q 'DobbyHook' hfamap/src/HFAMapLoadedMenuFeatureEnumerator.mm
          ! grep -q 'MSHookFunction' hfamap/src/HFAMapLoadedMenuFeatureEnumerator.mm
          ! grep -q 'vm_write' hfamap/src/HFAMapLoadedMenuFeatureEnumerator.mm
          ! grep -q 'RogueLegend' hfamap/src/HFAMapLoadedMenuFeatureEnumerator.mm
          ! grep -q '0x31AFD14' hfamap/src/HFAMapLoadedMenuFeatureEnumerator.mm
      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.5.13-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib hfamap/dist/v2.5.13-dev/HFAMapUniversal-v2.5.13-dev.dylib
          out=hfamap/dist/v2.5.13-dev/HFAMapUniversal-v2.5.13-dev.dylib
          strings "$out" > "$RUNNER_TEMP/hfamap2513.strings"
          file "$out" | grep -q arm64
          grep -q 'HFAMap v2.5.13-dev' "$RUNNER_TEMP/hfamap2513.strings"
          grep -q '2.5.13-dev-reference-feature-enumerator' "$RUNNER_TEMP/hfamap2513.strings"
          grep -q 'com.hfa.loaded-menu-feature-inventory/v1' "$RUNNER_TEMP/hfamap2513.strings"
          grep -q 'REFERENCE-INSPIRED-READ-ONLY-UI-PATCH-BLOCK-MULTIPATH' "$RUNNER_TEMP/hfamap2513.strings"
          shasum -a 256 "$out" | tee hfamap/dist/v2.5.13-dev/SHA256SUMS.txt
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.5.13-ReferenceFeatureEnumerator
          path: |
            hfamap/dist/v2.5.13-dev/HFAMapUniversal-v2.5.13-dev.dylib
            hfamap/dist/v2.5.13-dev/SHA256SUMS.txt
          if-no-files-found: error
