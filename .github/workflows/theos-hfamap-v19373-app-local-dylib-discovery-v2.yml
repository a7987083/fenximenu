name: HFAMapUniversal v1.9.37.4 ManualCandidateSelection

on:
  push:
    branches:
      - feature/hfamap-v19374-manual-candidate-selection
    paths:
      - 'hfamap/**'
      - '.github/scripts/hfamap_v*.py'
      - '.github/scripts/apply_hfamap_v*.py'
      - '.github/workflows/theos-hfamap-v19373-app-local-dylib-discovery-v2.yml'
      - 'tests/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate v1.9.37.4 ManualCandidateSelection
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_hfamap_v1936_chain.py
          python3 .github/scripts/hfamap_v19361_json_export.py
          python3 .github/scripts/hfamap_v19367_dynamic_apply_local.py
          python3 .github/scripts/hfamap_v19367_secret_callgraph_local.py
          python3 .github/scripts/hfamap_v19367_app_local_menu_resolver.py
          python3 .github/scripts/hfamap_v19367_ui_cleanup.py
          python3 .github/scripts/hfamap_v19367_trace_cleanup.py
          python3 .github/scripts/hfamap_v19367_generic_cleanup.py
          python3 .github/scripts/hfamap_v19368_family_menu_resolver.py
          python3 .github/scripts/apply_hfamap_v19370.py
          python3 .github/scripts/hfamap_v19371_5m_dispatcher_resolver.py
          python3 .github/scripts/hfamap_v19372_5m_dual_backend_fix.py
          python3 .github/scripts/hfamap_v19373_app_local_dylib_discovery_v2.py
          cp hfamap/src/HFAMapFamilyRuntimeResolver.m /tmp/family.before
          cp hfamap/src/HFAMap5MDispatcherResolver.m /tmp/dispatch.before
          cp hfamap/src/HFAMapJailpatchRuntimeProfiler.m /tmp/profiler.before
          cp hfamap/src/HFAMapPatchExecutionTrace.m /tmp/trace.before
          python3 .github/scripts/hfamap_v19374_prepare_patch.py
          python3 .github/scripts/hfamap_v19374_manual_candidate_selection.py
          git diff --check

      - name: Verify manual selection behavior
        run: |
          set -euo pipefail
          grep -q 'HFAAppLocalCopyCandidates' hfamap/src/HFAMapAppLocalResolver.m
          grep -q 'HFAAppLocalSelectCandidateAtIndex' hfamap/src/HFAMapAppLocalResolver.m
          grep -q '\[SELECT-WAIT\]' hfamap/src/HFAMapAppLocalResolver.m
          grep -q '\[MANUAL-SELECT\]' hfamap/src/HFAMapAppLocalResolver.m
          grep -q 'showCandidateSelector' hfamap/src/HFAMapCyberUI.m
          grep -q '请先扫描并手动选择一个菜单 dylib' hfamap/src/HFAMapCyberUI.m
          if grep -q '\[SELECT\] primary=' hfamap/src/HFAMapAppLocalResolver.m; then
            echo 'automatic primary selection remains'; exit 1
          fi

      - name: Verify dependency discovery
        run: |
          set -euo pipefail
          grep -q '\[DEPENDENCY\]' hfamap/src/HFAMapAppLocalResolver.m
          grep -q 'LC_LOAD_DYLIB' hfamap/src/HFAMapAppLocalResolver.m
          grep -q 'LC_LOAD_WEAK_DYLIB' hfamap/src/HFAMapAppLocalResolver.m
          grep -q '@executable_path/' hfamap/src/HFAMapAppLocalResolver.m
          grep -q '@loader_path/' hfamap/src/HFAMapAppLocalResolver.m
          grep -q '@rpath/' hfamap/src/HFAMapAppLocalResolver.m

      - name: Verify parser backends unchanged
        run: |
          set -euo pipefail
          cmp /tmp/family.before hfamap/src/HFAMapFamilyRuntimeResolver.m
          cmp /tmp/dispatch.before hfamap/src/HFAMap5MDispatcherResolver.m
          cmp /tmp/profiler.before hfamap/src/HFAMapJailpatchRuntimeProfiler.m
          cmp /tmp/trace.before hfamap/src/HFAMapPatchExecutionTrace.m
          if grep -R -n 'objc_getClassList\|_dyld_register_func_for_add_image' hfamap/src; then
            echo 'forbidden process-wide scan/listener present'; exit 1
          fi

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build HFAMapUniversal v1.9.37.4
        run: |
          set -euo pipefail
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out='dist/HFAMapUniversal_v1.9.37.4_ManualCandidateSelection.dylib'
          cp .theos/obj/HFAMapUniversal.dylib "$out"
          file "$out"
          shasum -a 256 "$out" | tee dist/SHA256_v1.9.37.4.txt
          strings "$out" > dist/strings_v1.9.37.4.txt
          nm -u "$out" > dist/nm_undefined_v1.9.37.4.txt
          grep -q 'v1.9.37.4 ManualCandidateSelection' dist/strings_v1.9.37.4.txt
          grep -q '\[DEPENDENCY\]' dist/strings_v1.9.37.4.txt
          grep -q '\[SELECT-WAIT\]' dist/strings_v1.9.37.4.txt
          grep -q '\[MANUAL-SELECT\]' dist/strings_v1.9.37.4.txt
          grep -q '选择菜单 dylib' dist/strings_v1.9.37.4.txt
          if grep -Eq '_objc_getClassList|_dyld_register_func_for_add_image' dist/nm_undefined_v1.9.37.4.txt; then
            echo 'forbidden symbol leaked into final dylib'; exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v1.9.37.4-ManualCandidateSelection
          path: |
            hfamap/dist/HFAMapUniversal_v1.9.37.4_ManualCandidateSelection.dylib
            hfamap/dist/SHA256_v1.9.37.4.txt
          if-no-files-found: error
