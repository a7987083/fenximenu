name: HFAMap v2.5.27 Native Consumer Target Bridge

on:
  push:
    branches:
      - feature/hfamap-v2.5.27-native-consumer-target-bridge
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - '.github/workflows/theos-hfamap-v2.5.27-native-consumer-target-bridge.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tests/*.py

      - name: Check v2.5.27 invariants
        run: |
          set -euo pipefail
          grep -q '2.5.27-dev-native-consumer-target-bridge' hfamap/src/HFAMapBuildInfo.mm
          grep -q 'HFAMapNativeConsumerTargetBridge.mm' hfamap/Makefile
          grep -q 'HFAMapResolveNativeConsumerTargets' hfamap/src/HFAMapCore.mm
          grep -q 'nativeConsumerTargetEvidence' hfamap/src/HFAMapCore.mm
          grep -q 'mach_vm_read_overwrite' hfamap/src/HFAMapNativeConsumerTargetBridge.mm
          grep -q 'HFAIL2CPPMethodForRuntimeAddress' hfamap/src/HFAMapNativeConsumerTargetBridge.mm
          grep -q 'HFAIL2CPPMethodContainingRuntimeAddress' hfamap/src/HFAMapNativeConsumerTargetBridge.mm
          grep -q 'unique-unity-live-pointee' hfamap/src/HFAMapNativeConsumerTargetBridge.mm
          grep -q 'ambiguous-multiple-unity-live-pointees' hfamap/src/HFAMapNativeConsumerTargetBridge.mm
          grep -q 'shared-native-consumer' hfamap/src/HFAMapStaticConsumerTargetResolver.mm

      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.5.27-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib hfamap/dist/v2.5.27-dev/HFAMapUniversal-v2.5.27-dev.dylib
          out=hfamap/dist/v2.5.27-dev/HFAMapUniversal-v2.5.27-dev.dylib
          strings "$out" > "$RUNNER_TEMP/hfamap2527.strings"
          file "$out" | grep -q arm64
          grep -q '2.5.27-dev-native-consumer-target-bridge' "$RUNNER_TEMP/hfamap2527.strings"
          grep -q 'static-indirect-slot-discovery+read-only-live-pointee+fail-closed-unique-unity-target' "$RUNNER_TEMP/hfamap2527.strings"
          shasum -a 256 "$out" | tee hfamap/dist/v2.5.27-dev/SHA256SUMS.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.5.27-NativeConsumerTargetBridge
          path: |
            hfamap/dist/v2.5.27-dev/HFAMapUniversal-v2.5.27-dev.dylib
            hfamap/dist/v2.5.27-dev/SHA256SUMS.txt
          if-no-files-found: error
