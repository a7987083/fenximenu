name: HFARuntimeAnalyzer v0.3.13.17 NativeEntrySemanticResolver

on:
  push:
    branches: [feature/hfaruntime-v0.3.13.17-native-entry-semantic-resolver-v1]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate and verify
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_hfaruntime_v031317_chain.py
          python3 -m py_compile \
            .github/scripts/apply_hfaruntime_v031317_chain.py \
            .github/scripts/hfamap_runtime_analyzer_v031317_native_entry_semantic.py \
            .github/scripts/apply_hfaruntime_v031316_chain.py
          TRACE=hfamap/src/HFAMapPatchExecutionTrace.m
          TRUTH=hfamap/src/HFAMapRuntimeModificationTruth.m
          UI=hfamap/src/HFAMapCyberUI.m
          grep -Fq '[V031317-NATIVE-ENTRY]' "$TRUTH"
          grep -Fq '[V031317-NATIVE-EDGE]' "$TRUTH"
          grep -Fq 'HFATNativeEntrySemantic' "$TRUTH"
          grep -Fq 'nativeEntrySemantic' "$TRUTH"
          grep -Fq '[V031316-HOOK-INGEST]' "$TRUTH"
          grep -Fq '[V031316-TARGET-CLASS]' "$TRUTH"
          grep -Fq '[V031317-TRUTH-SUMMARY]' "$TRACE"
          grep -Fq '[V031317-MOD-SEMANTIC]' "$TRACE"
          grep -Fq 'HFAMap_RuntimeModificationTruth_v031317.json' "$TRACE"
          grep -Fq 'v0.3.13.17 NativeEntrySemanticResolver' "$UI"
          if grep -Eiq 'Hello.?Kitty|MeChat|RandomDice|RoyalDice|Relationship Points|Damage Multiplier|CO-OP SP|PVP SP|Merge Any Dice|0x2073498|0x1E38F40|0x1E19A58|0x65958E4|0x30E9C64|0x2884188|0x1F711C8' \
             .github/scripts/hfamap_runtime_analyzer_v031317_native_entry_semantic.py \
             hfamap/src/HFAMapRuntimeModificationTruth.m; then
            echo 'SAMPLE-SPECIFIC STRING LEAKED INTO V031317'; exit 1
          fi
          git diff --check
      - name: Install dependencies
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Build
        run: |
          set -euo pipefail
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          SHORT_SHA="${GITHUB_SHA:0:8}"
          out="dist/HFARuntimeAnalyzer-v0.3.13.17-${SHORT_SHA}.dylib"
          sha_file="dist/SHA256_HFARuntimeAnalyzer-v0.3.13.17-${SHORT_SHA}.txt"
          strings_file="dist/HFARuntimeAnalyzer-v0.3.13.17-${SHORT_SHA}-strings.txt"
          cp .theos/obj/HFAMapUniversal.dylib "$out"
          file "$out"
          wc -c "$out" | tee "dist/SIZE_HFARuntimeAnalyzer-v0.3.13.17-${SHORT_SHA}.txt"
          shasum -a 256 "$out" | tee "$sha_file"
          strings "$out" > "$strings_file"
          grep -Fq 'V031317-NATIVE-ENTRY' "$strings_file"
          grep -Fq 'V031317-NATIVE-EDGE' "$strings_file"
          grep -Fq 'V031316-HOOK-INGEST' "$strings_file"
          grep -Fq 'V031316-TARGET-CLASS' "$strings_file"
          grep -Fq 'V031317-TRUTH-SUMMARY' "$strings_file"
          grep -Fq 'V031317-MOD-SEMANTIC' "$strings_file"
          grep -Fq 'HFAMap_RuntimeModificationTruth_v031317.json' "$strings_file"
          grep -Fq 'V031315-IL2CPP-CONTAINMENT' "$strings_file"
          grep -Fq 'V031311-IL2CPP-HIT' "$strings_file"
          grep -Fq 'V031312-CROSSIMAGE' "$strings_file"
      - uses: actions/upload-artifact@v4
        with:
          name: HFARuntimeAnalyzer-v0.3.13.17-${{ github.run_id }}
          path: |
            hfamap/dist/HFARuntimeAnalyzer-v0.3.13.17-*.dylib
            hfamap/dist/SHA256_HFARuntimeAnalyzer-v0.3.13.17-*.txt
            hfamap/dist/SIZE_HFARuntimeAnalyzer-v0.3.13.17-*.txt
          if-no-files-found: error
