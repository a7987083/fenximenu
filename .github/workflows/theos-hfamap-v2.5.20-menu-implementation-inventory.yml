name: HFAMap v2.5.20 Menu Implementation Inventory

on:
  push:
    branches:
      - feature/hfamap-v2.5.20-menu-implementation-inventory
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - '.github/workflows/theos-hfamap-v2.5.20-menu-implementation-inventory.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tests/*.py
      - name: Generate and check v2.5.20 invariants
        run: |
          set -euo pipefail
          python3 hfamap/tools/generate_v2519_loaded_safe.py
          python3 hfamap/tools/generate_v2519_sender_safe.py
          python3 hfamap/tools/generate_v2520_integration.py
          test -f hfamap/src/HFAMapBundleRootScanner2520.mm
          test -f hfamap/src/HFAMapStaticCatalog2520.mm
          grep -q 'HFAMapBuildMenuImplementationInventory' hfamap/src/HFAMapBundleRootScanner2520.mm
          grep -q 'menuImplementationRuntimeMethodCount' hfamap/src/HFAMapBundleRootScanner2520.mm
          grep -q 'HFAHostAppName()' hfamap/src/HFAMapStaticCatalog2520.mm
          grep -q '_HFAMap_StaticCatalog_' hfamap/src/HFAMapStaticCatalog2520.mm
          grep -q 'menu-action-il2cpp-correlation' hfamap/src/HFAMapMenuImplementationInventory.mm
          grep -q 'stateMutationCandidateIsNotProofOfWrite' hfamap/src/HFAMapMenuImplementationInventory.mm
          ! grep -q 'mach_vm_write' hfamap/src/HFAMapMenuImplementationInventory.mm
          ! grep -q 'DobbyHook' hfamap/src/HFAMapMenuImplementationInventory.mm
      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.5.20-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib hfamap/dist/v2.5.20-dev/HFAMapUniversal-v2.5.20-dev.dylib
          out=hfamap/dist/v2.5.20-dev/HFAMapUniversal-v2.5.20-dev.dylib
          strings "$out" > "$RUNNER_TEMP/hfamap2520.strings"
          file "$out" | grep -q arm64
          grep -q '2.5.20-dev-menu-implementation-inventory' "$RUNNER_TEMP/hfamap2520.strings"
          grep -q 'READ-ONLY-UNIFIED-PATCH-RUNTIME-METHOD-STATE-MUTATION-EVIDENCE' "$RUNNER_TEMP/hfamap2520.strings"
          grep -q 'com.hfa.menu-implementation-inventory/v1' "$RUNNER_TEMP/hfamap2520.strings"
          grep -q 'MenuImplementationInventory.json' "$RUNNER_TEMP/hfamap2520.strings"
          shasum -a 256 "$out" | tee hfamap/dist/v2.5.20-dev/SHA256SUMS.txt
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.5.20-MenuImplementationInventory
          path: |
            hfamap/dist/v2.5.20-dev/HFAMapUniversal-v2.5.20-dev.dylib
            hfamap/dist/v2.5.20-dev/SHA256SUMS.txt
          if-no-files-found: error
