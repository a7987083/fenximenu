name: HFAMap v2.5.8 Universal Imported Dylib Evidence

on:
  push:
    branches:
      - feature/hfamap-v2.5.8-imported-dylib-evidence
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - '.github/workflows/theos-hfamap-v2.5.8-universal-evidence.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tests/*.py
      - name: Check universal evidence invariants
        run: |
          set -euo pipefail
          grep -q 'src/HFAMapImportedDylibEvidenceAnalyzer.mm' hfamap/Makefile
          grep -q 'src/HFAMapVersion258.mm' hfamap/Makefile
          grep -q 'UNIVERSAL / 通用 ONLY' hfamap/src/HFAMapImportedDylibEvidenceAnalyzer.h
          grep -q 'UNIVERSAL-ONLY-STRUCTURAL-EVIDENCE-NO-SAMPLE-SPECIAL-CASES' hfamap/src/HFAMapImportedDylibEvidenceAnalyzer.mm
          grep -q 'com.hfa.imported-dylib-evidence/v1' hfamap/src/HFAMapImportedDylibEvidenceAnalyzer.mm
          grep -q 'imported-dylib-evidence' hfamap/src/HFAMapBundleRootScanner.mm
          grep -q 'HFAMap v2.5.8' hfamap/src/HFAMapBundleRootScanner.mm
          grep -q 'HFAMap v2.5.8-dev' hfamap/src/HFAMapVersion258.mm
          ! grep -q 'RogueLegend' hfamap/src/HFAMapImportedDylibEvidenceAnalyzer.mm
          ! grep -q 'CheatGetMoney' hfamap/src/HFAMapImportedDylibEvidenceAnalyzer.mm
          ! grep -q 'God Mode' hfamap/src/HFAMapImportedDylibEvidenceAnalyzer.mm
          ! grep -q '0x31AFD14' hfamap/src/HFAMapImportedDylibEvidenceAnalyzer.mm
      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.5.8-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib hfamap/dist/v2.5.8-dev/HFAMapUniversal-v2.5.8-dev.dylib
          out=hfamap/dist/v2.5.8-dev/HFAMapUniversal-v2.5.8-dev.dylib
          strings "$out" > "$RUNNER_TEMP/hfamap258.strings"
          file "$out" | grep -q arm64
          grep -q 'HFAMap v2.5.8-dev' "$RUNNER_TEMP/hfamap258.strings"
          grep -q '2.5.8-dev-universal-imported-dylib-evidence' "$RUNNER_TEMP/hfamap258.strings"
          grep -q 'com.hfa.imported-dylib-evidence/v1' "$RUNNER_TEMP/hfamap258.strings"
          grep -q 'UNIVERSAL-ONLY-STRUCTURAL-EVIDENCE-NO-SAMPLE-SPECIAL-CASES' "$RUNNER_TEMP/hfamap258.strings"
          shasum -a 256 "$out" | tee hfamap/dist/v2.5.8-dev/SHA256SUMS.txt
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.5.8-UniversalImportedDylibEvidence
          path: |
            hfamap/dist/v2.5.8-dev/HFAMapUniversal-v2.5.8-dev.dylib
            hfamap/dist/v2.5.8-dev/SHA256SUMS.txt
          if-no-files-found: error
