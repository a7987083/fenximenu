name: HFAMap v2.5.10 Directed Descriptor Resolution

on:
  push:
    branches:
      - feature/hfamap-v2.5.10-directed-descriptor-resolution
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - '.github/workflows/theos-hfamap-v2.5.10-directed-descriptor.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tests/*.py
      - name: Check v2.5.10 invariants
        run: |
          set -euo pipefail
          grep -q 'src/HFAMapDirectedDescriptorResolver.mm' hfamap/Makefile
          grep -q 'src/HFAMapVersion2510.mm' hfamap/Makefile
          grep -q 'UNIVERSAL-DIRECTED-READ-ONLY-NO-SAMPLE-SPECIAL-CASES' hfamap/src/HFAMapDirectedDescriptorResolver.mm
          grep -q 'com.hfa.directed-descriptor/v1' hfamap/src/HFAMapDirectedDescriptorResolver.mm
          grep -q 'kHFADirectedMaxDepth = 8' hfamap/src/HFAMapDirectedDescriptorResolver.mm
          grep -q 'runtime-descriptor-correlated' hfamap/src/HFAMapDirectedDescriptorResolver.mm
          grep -q 'HFAMap v2.5.10' hfamap/src/HFAMapBundleRootScanner.mm
          ! grep -q 'RogueLegend' hfamap/src/HFAMapDirectedDescriptorResolver.mm
          ! grep -q 'Damage Multiplier' hfamap/src/HFAMapDirectedDescriptorResolver.mm
          ! grep -q 'DobbyHook' hfamap/src/HFAMapDirectedDescriptorResolver.mm
      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.5.10-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib hfamap/dist/v2.5.10-dev/HFAMapUniversal-v2.5.10-dev.dylib
          out=hfamap/dist/v2.5.10-dev/HFAMapUniversal-v2.5.10-dev.dylib
          strings "$out" > "$RUNNER_TEMP/hfamap2510.strings"
          file "$out" | grep -q arm64
          grep -q 'HFAMap v2.5.10-dev' "$RUNNER_TEMP/hfamap2510.strings"
          grep -q '2.5.10-dev-directed-descriptor-resolution' "$RUNNER_TEMP/hfamap2510.strings"
          grep -q 'com.hfa.directed-descriptor/v1' "$RUNNER_TEMP/hfamap2510.strings"
          grep -q 'UNIVERSAL-DIRECTED-READ-ONLY-NO-SAMPLE-SPECIAL-CASES' "$RUNNER_TEMP/hfamap2510.strings"
          shasum -a 256 "$out" | tee hfamap/dist/v2.5.10-dev/SHA256SUMS.txt
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.5.10-DirectedDescriptorResolution
          path: |
            hfamap/dist/v2.5.10-dev/HFAMapUniversal-v2.5.10-dev.dylib
            hfamap/dist/v2.5.10-dev/SHA256SUMS.txt
          if-no-files-found: error
