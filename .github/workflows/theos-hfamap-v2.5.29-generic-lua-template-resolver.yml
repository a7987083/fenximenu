name: HFAMap v2.5.29 Generic Lua Template Resolver

on:
  push:
    branches:
      - feature/hfamap-v2.5.29-generic-lua-template-resolver
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - '.github/workflows/theos-hfamap-v2.5.29-generic-lua-template-resolver.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tests/*.py

      - name: Check v2.5.29 invariants
        run: |
          set -euo pipefail
          grep -q '2.5.29-dev-generic-lua-template-resolver' hfamap/src/HFAMapBuildInfo.mm
          grep -q 'HFAMapGenericRuntimeTemplateResolver.mm' hfamap/Makefile
          grep -q 'HFAMapResolveGenericRuntimeTemplates' hfamap/src/HFAMapCore.mm
          grep -q 'runtimeTemplateEvidence' hfamap/src/HFAMapCore.mm
          grep -q 'RuntimeTemplates.json' hfamap/src/HFAMapGenericRuntimeTemplateResolver.mm
          grep -q 'generic-arm64-wrapper-core-discovery+read-only-natural-runtime-plaintext+fail-closed' hfamap/src/HFAMapGenericRuntimeTemplateResolver.mm
          grep -q 'unknownCodeInvoked' hfamap/src/HFAMapGenericRuntimeTemplateResolver.mm
          grep -q 'memoryWritten' hfamap/src/HFAMapGenericRuntimeTemplateResolver.mm

      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/HFAMapUniversal-v2.5.29-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib hfamap/dist/HFAMapUniversal-v2.5.29-dev/HFAMapUniversal-v2.5.29-dev.dylib
          out=hfamap/dist/HFAMapUniversal-v2.5.29-dev/HFAMapUniversal-v2.5.29-dev.dylib
          strings "$out" > "$RUNNER_TEMP/hfamap2529.strings"
          file "$out" | grep -q arm64
          grep -q '2.5.29-dev-generic-lua-template-resolver' "$RUNNER_TEMP/hfamap2529.strings"
          grep -q 'generic-arm64-wrapper-core-discovery+read-only-natural-runtime-plaintext+fail-closed' "$RUNNER_TEMP/hfamap2529.strings"
          shasum -a 256 "$out" | tee hfamap/dist/HFAMapUniversal-v2.5.29-dev/SHA256SUMS.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.5.29-GenericLuaTemplateResolver
          path: |
            hfamap/dist/HFAMapUniversal-v2.5.29-dev/HFAMapUniversal-v2.5.29-dev.dylib
            hfamap/dist/HFAMapUniversal-v2.5.29-dev/SHA256SUMS.txt
          if-no-files-found: error
