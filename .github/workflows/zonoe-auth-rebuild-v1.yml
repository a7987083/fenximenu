name: Build Zonoe Auth Rebuild V2
on:
  workflow_dispatch:
  push:
    branches: ["test/h5gg-float-smoke-v1"]
    paths:
      - "experiments/zonoe-auth-rebuild-v1/**"
      - ".github/workflows/zonoe-auth-rebuild-v1.yml"
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS dylib
        shell: bash
        run: |
          set -euxo pipefail
          SRC="experiments/zonoe-auth-rebuild-v1"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -fobjc-arc -dynamiclib -arch arm64 -isysroot "$SDK" -miphoneos-version-min=13.0 \
            "$SRC/ZONUI.m" "$SRC/ZONNetwork.m" "$SRC/ZONActivation.m" "$SRC/ZONVerify.m" \
            "$SRC/ZONStorage.m" "$SRC/ZONResponseFormatter.m" "$SRC/ZONEntry.m" \
            "$SRC/ZONDylibConfig.m" "$SRC/ZONDylibVerify.m" \
            -framework UIKit -framework Foundation -framework Security -framework QuartzCore -framework CoreGraphics \
            -o ZonoeAuthRebuildV2.dylib
          codesign -f -s - ZonoeAuthRebuildV2.dylib
          file ZonoeAuthRebuildV2.dylib
          xcrun vtool -show-build ZonoeAuthRebuildV2.dylib || true
          shasum -a 256 ZonoeAuthRebuildV2.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: ZonoeAuthRebuildV2-arm64-ios13
          path: ZonoeAuthRebuildV2.dylib
