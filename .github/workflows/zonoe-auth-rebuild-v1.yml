name: Build Zonoe API Full Smoke V1
on:
  workflow_dispatch:
  push:
    branches: ["test/zonoe-api-full-smoke-v1"]
    paths:
      - "experiments/zonoe-auth-rebuild-v1/**"
      - ".github/workflows/zonoe-auth-rebuild-v1.yml"
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS dylib
        shell: bash
        run: |
          set -euxo pipefail
          SRC="experiments/zonoe-auth-rebuild-v1"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -fobjc-arc -dynamiclib -arch arm64 -isysroot "$SDK" -miphoneos-version-min=13.0 \
            "$SRC/ZONUI.m" "$SRC/ZONNetwork.m" "$SRC/ZONAPIEndpoints.m" \
            "$SRC/ZONAuthorization.m" "$SRC/ZONActivation.m" "$SRC/ZONLicenseStatus.m" \
            "$SRC/ZONVerify.m" "$SRC/ZONStorage.m" "$SRC/ZONResponseFormatter.m" \
            "$SRC/ZONAPISmokeCenter.m" "$SRC/ZONEntry.m" \
            "$SRC/ZONDylibConfig.m" "$SRC/ZONDylibVerify.m" \
            -framework UIKit -framework Foundation -framework Security -framework QuartzCore -framework CoreGraphics \
            -o ZonoeAPIFullSmokeV1.dylib
          codesign -f -s - ZonoeAPIFullSmokeV1.dylib
          file ZonoeAPIFullSmokeV1.dylib
          xcrun vtool -show-build ZonoeAPIFullSmokeV1.dylib || true
          shasum -a 256 ZonoeAPIFullSmokeV1.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: ZonoeAPIFullSmokeV1-arm64-ios13
          path: ZonoeAPIFullSmokeV1.dylib
