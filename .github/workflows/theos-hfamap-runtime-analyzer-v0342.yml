name: HFARuntimeAnalyzer v0.3.4.2 CFGReachability

on:
  push:
    branches:
      - feature/hfaruntime-v0.3.4.2-cfg-reachability
    paths:
      - 'hfamap/**'
      - '.github/scripts/**'
      - '.github/workflows/theos-hfamap-runtime-analyzer-v0342.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate baseline plus v0.3.4.2 CFG reachability
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_hfamap_v1936_chain.py
          python3 .github/scripts/hfamap_v19361_json_export.py
          python3 .github/scripts/hfamap_v19367_dynamic_apply_local.py
          python3 .github/scripts/hfamap_v19367_secret_callgraph_local.py
          python3 .github/scripts/hfamap_v19367_app_local_menu_resolver.py
          python3 .github/scripts/hfamap_v19367_ui_cleanup.py
          python3 .github/scripts/hfamap_v19367_trace_cleanup.py
          python3 .github/scripts/hfamap_v19367_generic_cleanup.py
          python3 .github/scripts/hfamap_v19368_family_menu_resolver.py
          python3 .github/scripts/apply_hfamap_v19370.py
          python3 .github/scripts/hfamap_v19371_5m_dispatcher_resolver.py
          python3 .github/scripts/hfamap_v19372_5m_dual_backend_fix.py
          python3 .github/scripts/hfamap_v19373_app_local_dylib_discovery_v2.py
          python3 .github/scripts/hfamap_v19374_prepare_patch.py
          python3 .github/scripts/hfamap_v19374_manual_candidate_selection.py
          python3 .github/scripts/hfamap_v19374_finalize_markers.py
          python3 .github/scripts/hfamap_v19375_loaded_macho_dependency_discovery.py
          python3 .github/scripts/hfamap_v19376_loaded_image_fingerprint.py
          python3 .github/scripts/hfamap_v19377_two_stage_class_metadata_scan.py
          python3 .github/scripts/hfamap_v19378_structural_relation_expansion.py
          python3 .github/scripts/hfamap_v19379_complete_feature_export.py
          python3 .github/scripts/hfamap_v193710_unified_feature_model.py
          python3 .github/scripts/hfamap_v193710_earntodie_verified_profile.py
          python3 .github/scripts/hfamap_runtime_analyzer_v02.py
          python3 .github/scripts/hfamap_runtime_analyzer_v02_fix1.py
          python3 .github/scripts/hfamap_runtime_analyzer_v03.py
          python3 .github/scripts/hfamap_runtime_analyzer_v03_fix1.py
          python3 .github/scripts/hfamap_runtime_analyzer_v032_auto_backend.py
          python3 .github/scripts/hfamap_runtime_analyzer_v032_output_layout.py
          python3 .github/scripts/hfamap_runtime_analyzer_v032_generic_output_fix.py
          python3 .github/scripts/hfamap_runtime_analyzer_v032_safe_discovery_paths.py
          python3 .github/scripts/hfamap_runtime_analyzer_v033_static_parity.py
          python3 .github/scripts/hfamap_runtime_analyzer_v033_fix1.py
          python3 .github/scripts/hfamap_runtime_analyzer_v034_semantic_backend.py
          python3 .github/scripts/hfamap_runtime_analyzer_v034_compile_fix.py
          python3 .github/scripts/hfamap_runtime_analyzer_v0341_stability.py
          python3 .github/scripts/hfamap_runtime_analyzer_v0342_cfg_reachability.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hfamap/src/HFAMapRuntimeAnalyzerV02.m')
          s=p.read_text()
          s=s.replace('static NSArray *HFAV02Hints(uintptr_t function,HFAV02Layout l)', 'static __attribute__((unused)) NSArray *HFAV02Hints(uintptr_t function,HFAV02Layout l)', 1)
          p.write_text(s)
          app=Path('hfamap/src/HFAMapAppLocalResolver.m')
          a=app.read_text().replace('static NSString *HFAAppLocalResolveInstallName(', 'static __attribute__((unused)) NSString *HFAAppLocalResolveInstallName(', 1)
          app.write_text(a)
          PY
          git diff --check

      - name: Verify v0.3.4.2 generated sources
        run: |
          set -euo pipefail
          check() { file="$1"; needle="$2"; if ! grep -Fq "$needle" "$file"; then echo "MISSING [$needle] in $file"; exit 1; fi; }
          SRC=hfamap/src/HFAMapRuntimeAnalyzerV02.m
          SEM=hfamap/src/HFARuntimeSemanticAnalyzer.m
          UI=hfamap/src/HFAMapCyberUI.m
          HDR=hfamap/src/HFARuntimeSemanticAnalyzer.h
          check "$SEM" 'HFASemBuildReachability'
          check "$SEM" 'reachable[256]'
          check "$SEM" 'basicBlocks'
          check "$SEM" 'reachableInstructions'
          check "$SEM" 'HFASemConditionalTarget'
          check "$SEM" 'return-transform'
          check "$SEM" 'support-thunk'
          check "$SEM" 'TAILCALL_ORIGINAL'
          check "$SEM" 'HFAMap_RuntimeAnalyzer_v0342_stage.log'
          check "$SEM" 'V0342-CFG-END'
          check "$SRC" 'HFAV0342NextReplacementBoundary'
          check "$SRC" 'HFASemanticAnalyzeReplacementBounded'
          check "$SRC" '[V0342-BOUNDARY]'
          check "$SRC" '[V0342-SCAN-BEGIN]'
          check "$SRC" '[V0342-SEM-BEGIN]'
          check "$SRC" '[V0342-SCAN-END]'
          check "$SRC" 'HFAEnableIL2CPPEnrichmentV0342'
          check "$SRC" 'disabled-by-default'
          check "$SRC" 'HFAMap_RuntimeAnalyzer_v0342.json'
          check "$SRC" 'com.hfa.runtime-analyzer/v0.3.4.2'
          check "$UI" 'DISPATCH_QUEUE_SERIAL'
          check "$UI" 'HFAMap RuntimeAnalyzer v0.3.4.2 CFGReachability'
          check "$HDR" 'HFASemanticAnalyzeReplacementBounded'
          check hfamap/Makefile 'src/HFARuntimeSemanticAnalyzer.m'
          test -f hfamap/src/HFAMapOutputPaths.h
          test -f hfamap/src/HFAMapOutputPaths.m
          if grep -R -Fq 'Documents/HFAMap_' hfamap/src --include='*.m' --include='*.mm'; then echo 'DIRECT OUTPUT PATH REGRESSION'; grep -R -Fn 'Documents/HFAMap_' hfamap/src --include='*.m' --include='*.mm' || true; exit 1; fi

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build v0.3.4.2
        run: |
          set -euo pipefail
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out='dist/HFARuntimeAnalyzer-v0.3.4.2-CFGReachability.dylib'
          cp .theos/obj/HFAMapUniversal.dylib "$out"
          file "$out"
          shasum -a 256 "$out" | tee dist/SHA256_HFARuntimeAnalyzer-v0.3.4.2-CFGReachability.txt
          strings "$out" > dist/strings_v0342.txt
          grep -q 'V0342-BOUNDARY' dist/strings_v0342.txt
          grep -q 'V0342-CFG-END' dist/strings_v0342.txt
          grep -q 'V0342-SCAN-BEGIN' dist/strings_v0342.txt
          grep -q 'V0342-SEM-BEGIN' dist/strings_v0342.txt
          grep -q 'return-transform' dist/strings_v0342.txt
          grep -q 'support-thunk' dist/strings_v0342.txt
          grep -q 'HFAEnableIL2CPPEnrichmentV0342' dist/strings_v0342.txt
          grep -q 'HFAMap_RuntimeAnalyzer_v0342.json' dist/strings_v0342.txt
          grep -q 'HFAMap_RuntimeAnalyzer_v0342_stage.log' dist/strings_v0342.txt
          grep -Fxq 'com.hfa.runtime-analyzer/v0.3.4.2' dist/strings_v0342.txt
          grep -q 'HFAMap RuntimeAnalyzer v0.3.4.2 CFGReachability' dist/strings_v0342.txt
          grep -q 'HFAMap_%@' dist/strings_v0342.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HFARuntimeAnalyzer-v0.3.4.2-CFGReachability
          path: |
            hfamap/dist/HFARuntimeAnalyzer-v0.3.4.2-CFGReachability.dylib
            hfamap/dist/SHA256_HFARuntimeAnalyzer-v0.3.4.2-CFGReachability.txt
          if-no-files-found: error
