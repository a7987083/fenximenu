name: HFAMap v2.5.15 Shared Target Branch Provenance

on:
  push:
    branches:
      - feature/hfamap-v2.5.15-shared-target-branch-provenance
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - '.github/workflows/theos-hfamap-v2.5.15-shared-target-branch-provenance.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tests/*.py
      - name: Check v2.5.15 invariants
        run: |
          set -euo pipefail
          grep -q 'src/HFAMapHandlerBranchProvenanceResolver.mm' hfamap/Makefile
          grep -q 'src/HFAMapFeatureBranchProvenance.mm' hfamap/Makefile
          grep -q 'src/HFAMapVersion2515.mm' hfamap/Makefile
          grep -q 'ENTRY-SEEDED-X0-X1-X2-SHARED-TARGET-DOWNGRADE' hfamap/src/HFAMapFeatureBranchProvenance.mm
          grep -q 'sharedTargetBlocksAreNotFeatureOwned' hfamap/src/HFAMapFeatureBranchProvenance.mm
          grep -q 'HFABPEntrySender' hfamap/src/HFAMapHandlerBranchProvenanceResolver.mm
          grep -q 'FeatureBranchProvenance.json' hfamap/src/HFAMapFeatureBranchProvenance.mm
          ! grep -q '0x3929C0' hfamap/src/HFAMapFeatureBranchProvenance.mm
          ! grep -q '0x31AFD14' hfamap/src/HFAMapHandlerBranchProvenanceResolver.mm
          ! grep -q 'DobbyHook' hfamap/src/HFAMapFeatureBranchProvenance.mm
          ! grep -q 'MSHookFunction' hfamap/src/HFAMapHandlerBranchProvenanceResolver.mm
          ! grep -q 'vm_write' hfamap/src/HFAMapFeatureBranchProvenance.mm
      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.5.15-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib hfamap/dist/v2.5.15-dev/HFAMapUniversal-v2.5.15-dev.dylib
          out=hfamap/dist/v2.5.15-dev/HFAMapUniversal-v2.5.15-dev.dylib
          strings "$out" > "$RUNNER_TEMP/hfamap2515.strings"
          file "$out" | grep -q arm64
          grep -q '2.5.15-dev-shared-target-branch-provenance' "$RUNNER_TEMP/hfamap2515.strings"
          grep -q 'ENTRY-SEEDED-X0-X1-X2-SHARED-TARGET-DOWNGRADE' "$RUNNER_TEMP/hfamap2515.strings"
          grep -q 'com.hfa.handler-branch-provenance/v1' "$RUNNER_TEMP/hfamap2515.strings"
          shasum -a 256 "$out" | tee hfamap/dist/v2.5.15-dev/SHA256SUMS.txt
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.5.15-SharedTargetBranchProvenance
          path: |
            hfamap/dist/v2.5.15-dev/HFAMapUniversal-v2.5.15-dev.dylib
            hfamap/dist/v2.5.15-dev/SHA256SUMS.txt
          if-no-files-found: error
