name: HFAMap v2.5.22 Feature Dispatcher Slicing

on:
  push:
    branches:
      - feature/hfamap-v2.5.22-feature-dispatcher-slicing
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - '.github/workflows/theos-hfamap-v2.5.22-feature-dispatcher-slicing.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tests/*.py
      - name: Check v2.5.22 invariants
        run: |
          set -euo pipefail
          grep -q 'FeatureDispatcherSlices.json' hfamap/src/HFAMapFeatureDispatcherSliceResolver.mm
          grep -q 'feature-sender-x2' hfamap/src/HFAMapFeatureDispatcherSliceResolver.mm
          grep -q 'HFAIL2CPPMethodContainingRuntimeAddress' hfamap/src/HFAMapFeatureDispatcherSliceResolver.mm
          ! grep -q 'HFAMapAnalyzeStrippedActionIMP(' hfamap/src/HFAMapFeatureDispatcherSliceResolver.mm
          ! grep -q 'DobbyHook' hfamap/src/HFAMapFeatureDispatcherSliceResolver.mm
      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.5.22-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib hfamap/dist/v2.5.22-dev/HFAMapUniversal-v2.5.22-dev.dylib
          out=hfamap/dist/v2.5.22-dev/HFAMapUniversal-v2.5.22-dev.dylib
          strings "$out" > "$RUNNER_TEMP/hfamap2522.strings"
          file "$out" | grep -q arm64
          grep -q '2.5.22-dev-feature-dispatcher-slicing' "$RUNNER_TEMP/hfamap2522.strings"
          grep -q 'READ-ONLY-ENTRY-SENDER-FEATURE-SLICING-NO-REEXECUTION' "$RUNNER_TEMP/hfamap2522.strings"
          shasum -a 256 "$out" | tee hfamap/dist/v2.5.22-dev/SHA256SUMS.txt
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.5.22-FeatureDispatcherSlicing
          path: |
            hfamap/dist/v2.5.22-dev/HFAMapUniversal-v2.5.22-dev.dylib
            hfamap/dist/v2.5.22-dev/SHA256SUMS.txt
          if-no-files-found: error
