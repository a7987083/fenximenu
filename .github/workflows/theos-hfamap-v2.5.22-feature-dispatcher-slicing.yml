name: HFAMap v2.5.24 Two Button Unified UI

on:
  push:
    branches:
      - feature/hfamap-v2.5.22-feature-dispatcher-slicing
      - feature/hfamap-v2.5.23-exact-runtime-method-trace
      - feature/hfamap-v2.5.24-two-button-unified-ui
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - '.github/workflows/theos-hfamap-v2.5.22-feature-dispatcher-slicing.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tests/*.py
      - name: Check v2.5.24 invariants
        run: |
          set -euo pipefail
          grep -q 'FeatureDispatcherSlices.json' hfamap/src/HFAMapFeatureDispatcherSliceResolver.mm
          grep -q 'feature-sender-x2' hfamap/src/HFAMapFeatureDispatcherSliceResolver.mm
          grep -q 'HFAIL2CPPMethodContainingRuntimeAddress' hfamap/src/HFAMapFeatureDispatcherSliceResolver.mm
          ! grep -q 'HFAMapAnalyzeStrippedActionIMP(' hfamap/src/HFAMapFeatureDispatcherSliceResolver.mm
          ! grep -q 'DobbyHook' hfamap/src/HFAMapFeatureDispatcherSliceResolver.mm
          grep -q 'eventTime>=interactionTime&&delta<=500ms' hfamap/src/HFAExactRuntimeMethodTrace.mm
          grep -q 'futureInteractionAssociation' hfamap/src/HFAExactRuntimeMethodTrace.mm
          grep -q 'CFBundleExecutable' hfamap/src/HFAExactRuntimeMethodTrace.mm
          grep -q '扫描菜单模块' hfamap/src/HFAMapCyberUI.m
          grep -q '解析并导出' hfamap/src/HFAMapCyberUI.m
          grep -q '主程序/UnityFramework 自动识别' hfamap/src/HFAMapCyberUI.m
          grep -q 'HFAMapSelectMenuCandidate' hfamap/src/HFAMapCyberUI.m
          ! grep -q '1. Search Menu' hfamap/src/HFAMapEntry.mm
          ! grep -q '3. Runtime Probe' hfamap/src/HFAMapEntry.mm
          ! grep -q '4. Static Analyze Dylib' hfamap/src/HFAMapEntry.mm
          ! grep -q 'HFAMapVersion259.mm' hfamap/Makefile
          grep -q '2.5.24-dev' hfamap/src/HFAMapBuildInfo.mm
      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.5.24-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib hfamap/dist/v2.5.24-dev/HFAMapUniversal-v2.5.24-dev.dylib
          out=hfamap/dist/v2.5.24-dev/HFAMapUniversal-v2.5.24-dev.dylib
          strings "$out" > "$RUNNER_TEMP/hfamap2524.strings"
          file "$out" | grep -q arm64
          grep -q '2.5.24-dev-two-button-unified-ui' "$RUNNER_TEMP/hfamap2524.strings"
          grep -q '扫描菜单模块' "$RUNNER_TEMP/hfamap2524.strings"
          grep -q '解析并导出' "$RUNNER_TEMP/hfamap2524.strings"
          ! grep -q 'HFAMap v2.5.9-dev' "$RUNNER_TEMP/hfamap2524.strings"
          grep -q '2.5.22-dev-feature-dispatcher-slicing' "$RUNNER_TEMP/hfamap2524.strings"
          grep -q 'eventTime>=interactionTime&&delta<=500ms' "$RUNNER_TEMP/hfamap2524.strings"
          grep -q 'real-CFBundleExecutable-never-@main' "$RUNNER_TEMP/hfamap2524.strings"
          grep -q 'READ-ONLY-ENTRY-SENDER-FEATURE-SLICING-NO-REEXECUTION' "$RUNNER_TEMP/hfamap2524.strings"
          shasum -a 256 "$out" | tee hfamap/dist/v2.5.24-dev/SHA256SUMS.txt
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.5.24-TwoButtonUnifiedUI
          path: |
            hfamap/dist/v2.5.24-dev/HFAMapUniversal-v2.5.24-dev.dylib
            hfamap/dist/v2.5.24-dev/SHA256SUMS.txt
          if-no-files-found: error
