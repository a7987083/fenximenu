name: HFAMap v2.5.16 Sender Derived Provenance

on:
  push:
    branches:
      - feature/hfamap-v2.5.16-sender-derived-provenance
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - '.github/workflows/theos-hfamap-v2.5.16-sender-derived-provenance.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tests/*.py
      - name: Check v2.5.16 invariants
        run: |
          set -euo pipefail
          grep -q 'src/HFAMapSenderDerivedProvenanceResolver.mm' hfamap/Makefile
          grep -q 'src/HFAMapVersion2516.mm' hfamap/Makefile
          grep -q 'READ-ONLY-SENDER-FIELD-CALL-BRANCH-PROVENANCE' hfamap/src/HFAMapSenderDerivedProvenanceResolver.mm
          grep -q 'SenderDerivedProvenance.json' hfamap/src/HFAMapSenderDerivedProvenanceResolver.mm
          grep -q 'senderDerivedBranches' hfamap/src/HFAMapSenderDerivedProvenanceResolver.mm
          grep -q 'senderDerivedCalls' hfamap/src/HFAMapSenderDerivedProvenanceResolver.mm
          ! grep -q '0x3929C0' hfamap/src/HFAMapSenderDerivedProvenanceResolver.mm
          ! grep -q '0xB96B2C' hfamap/src/HFAMapSenderDerivedProvenanceResolver.mm
          ! grep -q '0xB96A54' hfamap/src/HFAMapSenderDerivedProvenanceResolver.mm
          ! grep -q 'DobbyHook' hfamap/src/HFAMapSenderDerivedProvenanceResolver.mm
          ! grep -q 'MSHookFunction' hfamap/src/HFAMapSenderDerivedProvenanceResolver.mm
          ! grep -q 'vm_write' hfamap/src/HFAMapSenderDerivedProvenanceResolver.mm
      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.5.16-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib hfamap/dist/v2.5.16-dev/HFAMapUniversal-v2.5.16-dev.dylib
          out=hfamap/dist/v2.5.16-dev/HFAMapUniversal-v2.5.16-dev.dylib
          strings "$out" > "$RUNNER_TEMP/hfamap2516.strings"
          file "$out" | grep -q arm64
          grep -q '2.5.16-dev-sender-derived-provenance' "$RUNNER_TEMP/hfamap2516.strings"
          grep -q 'READ-ONLY-SENDER-FIELD-CALL-BRANCH-PROVENANCE' "$RUNNER_TEMP/hfamap2516.strings"
          shasum -a 256 "$out" | tee hfamap/dist/v2.5.16-dev/SHA256SUMS.txt
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.5.16-SenderDerivedProvenance
          path: |
            hfamap/dist/v2.5.16-dev/HFAMapUniversal-v2.5.16-dev.dylib
            hfamap/dist/v2.5.16-dev/SHA256SUMS.txt
          if-no-files-found: error
