name: HFARuntimeAnalyzer v0.3.2 AutoBackend

on:
  push:
    branches:
      - feature/hfaruntime-v0.3.2-auto-backend-fiveclass
    paths:
      - 'hfamap/**'
      - '.github/scripts/**'
      - '.github/workflows/theos-hfamap-runtime-analyzer-v03.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate v1.9.37.10 baseline + RuntimeAnalyzer v0.3.2
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_hfamap_v1936_chain.py
          python3 .github/scripts/hfamap_v19361_json_export.py
          python3 .github/scripts/hfamap_v19367_dynamic_apply_local.py
          python3 .github/scripts/hfamap_v19367_secret_callgraph_local.py
          python3 .github/scripts/hfamap_v19367_app_local_menu_resolver.py
          python3 .github/scripts/hfamap_v19367_ui_cleanup.py
          python3 .github/scripts/hfamap_v19367_trace_cleanup.py
          python3 .github/scripts/hfamap_v19367_generic_cleanup.py
          python3 .github/scripts/hfamap_v19368_family_menu_resolver.py
          python3 .github/scripts/apply_hfamap_v19370.py
          python3 .github/scripts/hfamap_v19371_5m_dispatcher_resolver.py
          python3 .github/scripts/hfamap_v19372_5m_dual_backend_fix.py
          python3 .github/scripts/hfamap_v19373_app_local_dylib_discovery_v2.py
          python3 .github/scripts/hfamap_v19374_prepare_patch.py
          python3 .github/scripts/hfamap_v19374_manual_candidate_selection.py
          python3 .github/scripts/hfamap_v19374_finalize_markers.py
          python3 .github/scripts/hfamap_v19375_loaded_macho_dependency_discovery.py
          python3 .github/scripts/hfamap_v19376_loaded_image_fingerprint.py
          python3 .github/scripts/hfamap_v19377_two_stage_class_metadata_scan.py
          python3 .github/scripts/hfamap_v19378_structural_relation_expansion.py
          python3 .github/scripts/hfamap_v19379_complete_feature_export.py
          python3 .github/scripts/hfamap_v193710_unified_feature_model.py
          python3 .github/scripts/hfamap_v193710_earntodie_verified_profile.py
          python3 .github/scripts/hfamap_runtime_analyzer_v02.py
          python3 .github/scripts/hfamap_runtime_analyzer_v02_fix1.py
          python3 .github/scripts/hfamap_runtime_analyzer_v03.py
          python3 .github/scripts/hfamap_runtime_analyzer_v03_fix1.py
          python3 .github/scripts/hfamap_runtime_analyzer_v032_auto_backend.py
          python3 .github/scripts/hfamap_runtime_analyzer_v032_output_layout.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hfamap/src/HFAMapRuntimeAnalyzerV02.m')
          s=p.read_text()
          s=s.replace('static NSArray *HFAV02Hints(uintptr_t function,HFAV02Layout l)', 'static __attribute__((unused)) NSArray *HFAV02Hints(uintptr_t function,HFAV02Layout l)', 1)
          s=s.replace('com.hfa.runtime-analyzer/v0.3.2.2', 'com.hfa.runtime-analyzer/v0.3.2')
          p.write_text(s)
          PY
          git diff --check

      - name: Verify v0.3.2 generated sources
        run: |
          set -euo pipefail
          grep -q 'HFAV032TargetFamily' hfamap/src/HFAMapRuntimeAnalyzerV02.m
          grep -q '0x031201u' hfamap/src/HFAMapRuntimeAnalyzerV02.m
          grep -q '0x031211u' hfamap/src/HFAMapRuntimeAnalyzerV02.m
          grep -q 'receiver-capture' hfamap/src/HFAMapRuntimeAnalyzerV02.m
          grep -q 'runtime-state' hfamap/src/HFAMapRuntimeAnalyzerV02.m
          grep -q 'derivedPatches' hfamap/src/HFAMapRuntimeAnalyzerV02.m
          grep -q '\[V032-BACKEND\]' hfamap/src/HFAMapRuntimeAnalyzerV02.m
          grep -q '\[V032-SCAN-END\]' hfamap/src/HFAMapRuntimeAnalyzerV02.m
          grep -q 'com.hfa.runtime-analyzer/v0.3.2' hfamap/src/HFAMapRuntimeAnalyzerV02.m
          ! grep -q 'com.hfa.runtime-analyzer/v0.3.2.2' hfamap/src/HFAMapRuntimeAnalyzerV02.m
          grep -q 'HFAAppLocalScanCandidates()' hfamap/src/HFAMapCyberUI.m
          test -f hfamap/src/HFAMapOutputPaths.h
          test -f hfamap/src/HFAMapOutputPaths.m
          grep -q 'src/HFAMapOutputPaths.m' hfamap/Makefile
          grep -q 'HFAMap RuntimeAnalyzer v0.3.2 AutoBackend' hfamap/src/HFAMapCyberUI.m

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build v0.3.2
        run: |
          set -euo pipefail
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out='dist/HFARuntimeAnalyzer-v0.3.2-AutoBackend.dylib'
          cp .theos/obj/HFAMapUniversal.dylib "$out"
          file "$out"
          shasum -a 256 "$out" | tee dist/SHA256_HFARuntimeAnalyzer-v0.3.2-AutoBackend.txt
          strings "$out" > dist/strings_v032.txt
          grep -q 'V032-SCAN-END' dist/strings_v032.txt
          grep -q 'V032-BACKEND' dist/strings_v032.txt
          grep -q 'receiver-capture' dist/strings_v032.txt
          grep -Fxq 'com.hfa.runtime-analyzer/v0.3.2' dist/strings_v032.txt
          ! grep -Fq 'com.hfa.runtime-analyzer/v0.3.2.2' dist/strings_v032.txt
          grep -q 'HFAMap_RuntimeAnalyzer_v032.json' dist/strings_v032.txt
          grep -q 'HFAMap RuntimeAnalyzer v0.3.2 AutoBackend' dist/strings_v032.txt
          grep -q 'HFAMap_%@' dist/strings_v032.txt
          grep -q 'DISCOVERY-MODE' dist/strings_v032.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HFARuntimeAnalyzer-v0.3.2-AutoBackend
          path: |
            hfamap/dist/HFARuntimeAnalyzer-v0.3.2-AutoBackend.dylib
            hfamap/dist/SHA256_HFARuntimeAnalyzer-v0.3.2-AutoBackend.txt
          if-no-files-found: error
