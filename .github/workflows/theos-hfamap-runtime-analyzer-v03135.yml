name: HFARuntimeAnalyzer v0.3.13.5 RuntimeValueResolver

on:
  push:
    branches: [feature/hfaruntime-v0.3.13.5-runtime-value-resolver-v1]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate and verify
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_hfaruntime_v03135_chain.py
          python3 -m py_compile \
            .github/scripts/apply_hfaruntime_v03135_chain.py \
            .github/scripts/hfamap_runtime_analyzer_v03135_runtime_value_resolver.py \
            .github/scripts/apply_hfaruntime_v03134_chain.py
          TRACE=hfamap/src/HFAMapPatchExecutionTrace.m
          GENERIC=hfamap/src/HFAMapGenericMenuResolver.m
          UI=hfamap/src/HFAMapCyberUI.m
          grep -Fq '[V03135-TITLE-MERGE]' "$TRACE"
          grep -Fq 'HFA03135LabelScore' "$TRACE"
          grep -Fq '[V03135-RUNTIME-VALUE]' "$GENERIC"
          grep -Fq 'runtimeValueProbe' "$GENERIC"
          grep -Fq 'currentValue' "$GENERIC"
          grep -Fq 'HFA03135ProbeImplementation' "$GENERIC"
          grep -Fq 'HFA03135SemanticKind' "$GENERIC"
          grep -Fq 'HFAMap RuntimeAnalyzer v0.3.13.5 RuntimeValueResolver' "$UI"
          if grep -Eiq 'MeChat|RoyalDice|RandomDice|Hello Kitty|Relationship Points|Damage Multiplier|CO-OP SP|PVP SP|Merge Any Dice' .github/scripts/hfamap_runtime_analyzer_v03135_*.py; then echo 'SAMPLE-SPECIFIC STRING LEAKED INTO V03135'; exit 1; fi
          git diff --check
      - name: Install dependencies
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Build
        run: |
          set -euo pipefail
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          SHORT_SHA="${GITHUB_SHA:0:8}"
          out="dist/HFARuntimeAnalyzer-v0.3.13.5-${SHORT_SHA}.dylib"
          sha_file="dist/SHA256_HFARuntimeAnalyzer-v0.3.13.5-${SHORT_SHA}.txt"
          strings_file="dist/HFARuntimeAnalyzer-v0.3.13.5-${SHORT_SHA}-strings.txt"
          cp .theos/obj/HFAMapUniversal.dylib "$out"
          file "$out"
          wc -c "$out" | tee "dist/SIZE_HFARuntimeAnalyzer-v0.3.13.5-${SHORT_SHA}.txt"
          shasum -a 256 "$out" | tee "$sha_file"
          strings "$out" > "$strings_file"
          grep -Fq 'V03135-TITLE-MERGE' "$strings_file"
          grep -Fq 'V03135-RUNTIME-VALUE' "$strings_file"
          grep -Fq 'runtimeValueProbe' "$strings_file"
          grep -Fq 'currentValue' "$strings_file"
          grep -Fq 'v0.3.13.5 RuntimeValueResolver' "$strings_file"
          grep -Fq 'V03134-STARTUP-OWNERSHIP' "$strings_file"
          grep -Fq 'V03134-FEATURE-CATALOG' "$strings_file"
      - uses: actions/upload-artifact@v4
        with:
          name: HFARuntimeAnalyzer-v0.3.13.5-${{ github.run_id }}
          path: |
            hfamap/dist/HFARuntimeAnalyzer-v0.3.13.5-*.dylib
            hfamap/dist/SHA256_HFARuntimeAnalyzer-v0.3.13.5-*.txt
            hfamap/dist/SIZE_HFARuntimeAnalyzer-v0.3.13.5-*.txt
          if-no-files-found: error
