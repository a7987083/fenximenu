name: HFAMap v2.5.3 Offline Static Catalog

on:
  push:
    branches:
      - feature/hfamap-v2.5.3-offline-static-catalog
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/theos-hfamap-v2-bounded-universal.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tools/*.py tests/*.py

      - name: Check source invariants
        run: |
          set -euo pipefail
          grep -q 'src/HFAMapFastDiscovery.mm' hfamap/Makefile
          grep -q 'src/HFAMapStaticCatalog.mm' hfamap/Makefile
          grep -q 'src/HFAMapStaticCatalogBridge.mm' hfamap/Makefile
          grep -q 'com.hfa.fast-menu-discovery/v1' hfamap/src/HFAMapFastDiscovery.mm
          grep -q 'full-list-first-no-deep-analysis' hfamap/src/HFAMapFastDiscovery.mm
          ! grep -q 'HFAMapAnalyzeMenuBinary' hfamap/src/HFAMapFastDiscovery.mm
          ! grep -q 'HFAMapInventoryStrippedObjCActions' hfamap/src/HFAMapFastDiscovery.mm
          ! grep -q 'HFAIL2CPPBuildMethodIndex' hfamap/src/HFAMapFastDiscovery.mm
          grep -q 'HFAMapRunMenuDiscovery' hfamap/src/HFAMapCore.mm
          grep -q 'HFAMapRunSelectedDeepAnalysis' hfamap/src/HFAMapCore.mm
          grep -q 'HFAMapStaticCatalogAnnotateHandlerGraph' hfamap/src/HFAMapCore.mm
          grep -q 'globalRediscoveryPerformed' hfamap/src/HFAMapCore.mm
          grep -q '1. Search Menu' hfamap/src/HFAMapEntry.mm
          grep -q '2. Deep Analyze Menu' hfamap/src/HFAMapEntry.mm
          grep -q '3. Runtime Probe (8s)' hfamap/src/HFAMapEntry.mm
          grep -q '4. Static Analyze Dylib' hfamap/src/HFAMapEntry.mm
          grep -q '2.5.3-dev-offline-static-catalog' hfamap/src/HFAMapDiagnostics.mm
          grep -q 'HFAMap v2.5.3-dev Static Catalog' hfamap/src/HFAMapEntry.mm
          grep -q 'com.hfa.static-catalog/v1' hfamap/src/HFAMapStaticCatalog.mm
          grep -q 'com.hfa.static-runtime-method/v1' hfamap/src/HFAMapStaticCatalog.mm
          grep -q 'offline-file-read-only-no-dlopen' hfamap/src/HFAMapStaticCatalog.mm
          grep -q 'NSDataReadingMappedIfSafe' hfamap/src/HFAMapStaticCatalog.mm
          grep -q 'LC_FUNCTION_STARTS' hfamap/src/HFAMapStaticCatalog.mm
          grep -q 'LC_UUID' hfamap/src/HFAMapStaticCatalog.mm
          grep -q 'same-session-static-catalog-rva' hfamap/src/HFAMapStaticCatalog.mm
          grep -q 'runtime-handler-rva-to-same-session-static-catalog' hfamap/src/HFAMapStaticCatalogBridge.mm
          ! grep -q 'dlopen(' hfamap/src/HFAMapStaticCatalog.mm
          grep -q 'src/HFAIL2CPPMethodRangeIndex.mm' hfamap/Makefile
          grep -q 'src/HFAMapFeatureContextAnalyzer.mm' hfamap/Makefile
          grep -q 'src/HFAMapFeatureHandlerResolver.mm' hfamap/Makefile
          grep -q 'com.hfa.feature-handler-graph/v2' hfamap/src/HFAMapFeatureHandlerResolver.mm
          grep -q 'com.hfa.feature-ownership/v1' hfamap/src/HFAMapFeatureHandlerResolver.mm
          grep -q 'com.hfa.runtime-method-descriptor/v2' hfamap/src/HFAMapFeatureHandlerResolver.mm
          grep -q 'contextSeededAnalysis' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'com.hfa.stripped-action/v6' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          ! grep -q 'CheatGetMoney' hfamap/src/HFAMapStaticCatalog.mm
          ! grep -q 'CheatLevelUp' hfamap/src/HFAMapStaticCatalog.mm
          ! grep -q 'XPHero' hfamap/src/HFAMapStaticCatalog.mm
          ! grep -q '0xB8B608' hfamap/src/HFAMapStaticCatalog.mm
          ! grep -q '0xB8BA50' hfamap/src/HFAMapStaticCatalog.mm
          ! grep -q 'DobbyInstrument' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          ! grep -q 'vm_write' hfamap/src/HFAMapStaticCatalog.mm

      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.5.3-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib \
            hfamap/dist/v2.5.3-dev/HFAMapUniversal-v2.5.3-dev.dylib
          out=hfamap/dist/v2.5.3-dev/HFAMapUniversal-v2.5.3-dev.dylib
          strings_file="$RUNNER_TEMP/hfamap-v2.5.3.strings"
          file "$out" | grep -q arm64
          strings "$out" > "$strings_file"
          grep -q 'com.hfa.fast-menu-discovery/v1' "$strings_file"
          grep -q 'com.hfa.feature-handler-graph/v2' "$strings_file"
          grep -q 'com.hfa.static-catalog/v1' "$strings_file"
          grep -q 'com.hfa.static-runtime-method/v1' "$strings_file"
          grep -q 'same-session-static-catalog-rva' "$strings_file"
          grep -q 'HFAMap v2.5.3-dev Static Catalog' "$strings_file"
          grep -q '4. Static Analyze Dylib' "$strings_file"
          ! grep -q 'CheatGetMoney' "$strings_file"
          ! grep -q 'CheatLevelUp' "$strings_file"
          ! grep -q 'XPHero' "$strings_file"
          shasum -a 256 "$out" | tee hfamap/dist/v2.5.3-dev/SHA256SUMS.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.5.3-OfflineStaticCatalog
          path: |
            hfamap/dist/v2.5.3-dev/HFAMapUniversal-v2.5.3-dev.dylib
            hfamap/dist/v2.5.3-dev/SHA256SUMS.txt
          if-no-files-found: error
