name: HFAMap v2.5.4-r2 Stable Loader Bundle Scan

on:
  push:
    branches:
      - feature/hfamap-v2.5.4-r2-stable-loader-bundle-scan
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/theos-hfamap-v2-bounded-universal.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tools/*.py tests/*.py

      - name: Check source invariants
        run: |
          set -euo pipefail
          grep -q 'src/HFAMapFastDiscovery.mm' hfamap/Makefile
          grep -q 'src/HFAMapStaticCatalog.mm' hfamap/Makefile
          grep -q 'src/HFAMapStaticCatalogBridge.mm' hfamap/Makefile
          grep -q 'src/HFAMapDescriptorStaticCallbackResolver.mm' hfamap/Makefile
          ! grep -q 'HFAMapBundleRootScanner.mm' hfamap/Makefile
          grep -q 'NSBundle.mainBundle.bundlePath' hfamap/src/HFAMapEntry.mm
          grep -q 'kHFABundleScanMaxDepth = 12' hfamap/src/HFAMapEntry.mm
          grep -q 'kHFABundleScanMaxFiles = 512' hfamap/src/HFAMapEntry.mm
          grep -q '@"APP"' hfamap/src/HFAMapEntry.mm
          grep -q '@"DATA"' hfamap/src/HFAMapEntry.mm
          grep -q 'v2.5.4-r2 Stable Loader' hfamap/src/HFAMapEntry.mm
          ! grep -q 'method_setImplementation' hfamap/src/HFAMapEntry.mm
          ! grep -q 'NSClassFromString' hfamap/src/HFAMapEntry.mm
          grep -q 'com.hfa.fast-menu-discovery/v1' hfamap/src/HFAMapFastDiscovery.mm
          grep -q 'full-list-first-no-deep-analysis' hfamap/src/HFAMapFastDiscovery.mm
          grep -q 'HFAMapRunMenuDiscovery' hfamap/src/HFAMapCore.mm
          grep -q 'HFAMapRunSelectedDeepAnalysis' hfamap/src/HFAMapCore.mm
          grep -q 'HFAMapStaticCatalogAnnotateHandlerGraph' hfamap/src/HFAMapCore.mm
          grep -q '4. Static Analyze Dylib' hfamap/src/HFAMapEntry.mm
          grep -q 'com.hfa.static-catalog/v1' hfamap/src/HFAMapStaticCatalog.mm
          grep -q 'com.hfa.static-runtime-method/v1' hfamap/src/HFAMapStaticCatalog.mm
          grep -q 'offline-file-read-only-no-dlopen' hfamap/src/HFAMapStaticCatalog.mm
          grep -q 'NSDataReadingMappedIfSafe' hfamap/src/HFAMapStaticCatalog.mm
          grep -q 'LC_FUNCTION_STARTS' hfamap/src/HFAMapStaticCatalog.mm
          grep -q 'LC_UUID' hfamap/src/HFAMapStaticCatalog.mm
          grep -q 'runtime-handler-rva-to-same-session-static-catalog' hfamap/src/HFAMapStaticCatalogBridge.mm
          grep -q 'unique-descriptor-type-cohort' hfamap/src/HFAMapStaticCatalogBridge.mm
          grep -q 'HFAMapResolveDescriptorStaticCallbacks' hfamap/src/HFAMapStaticCatalogBridge.mm
          grep -q 'com.hfa.descriptor-static-callback/v1' hfamap/src/HFAMapDescriptorStaticCallbackResolver.mm
          grep -q 'exact-descriptor-token-or-unique-ordered-pointer-cluster-fail-closed' hfamap/src/HFAMapDescriptorStaticCallbackResolver.mm
          grep -q 'unique-ordered-static-callback-pointer-cluster' hfamap/src/HFAMapDescriptorStaticCallbackResolver.mm
          grep -q 'no-game-name-no-feature-name-no-method-name-no-fixed-rva' hfamap/src/HFAMapDescriptorStaticCallbackResolver.mm
          ! grep -q 'dlopen(' hfamap/src/HFAMapStaticCatalog.mm
          ! grep -q 'CheatGetMoney' hfamap/src/HFAMapDescriptorStaticCallbackResolver.mm
          ! grep -q 'CheatLevelUp' hfamap/src/HFAMapDescriptorStaticCallbackResolver.mm
          ! grep -q 'XPHero' hfamap/src/HFAMapDescriptorStaticCallbackResolver.mm
          ! grep -q '0xB8B608' hfamap/src/HFAMapDescriptorStaticCallbackResolver.mm
          ! grep -q '0xB8BA50' hfamap/src/HFAMapDescriptorStaticCallbackResolver.mm
          ! grep -q 'DobbyHook' hfamap/src/HFAMapDescriptorStaticCallbackResolver.mm
          ! grep -q 'vm_write' hfamap/src/HFAMapDescriptorStaticCallbackResolver.mm

      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.5.4-r2
          cp hfamap/.theos/obj/HFAMapUniversal.dylib \
            hfamap/dist/v2.5.4-r2/HFAMapUniversal-v2.5.4-r2.dylib
          out=hfamap/dist/v2.5.4-r2/HFAMapUniversal-v2.5.4-r2.dylib
          strings_file="$RUNNER_TEMP/hfamap-v2.5.4-r2.strings"
          file "$out" | grep -q arm64
          strings "$out" > "$strings_file"
          grep -q 'com.hfa.static-catalog/v1' "$strings_file"
          grep -q 'com.hfa.static-runtime-method/v1' "$strings_file"
          grep -q 'com.hfa.descriptor-static-callback/v1' "$strings_file"
          grep -q 'unique-ordered-static-callback-pointer-cluster' "$strings_file"
          grep -q 'v2.5.4-r2 Stable Loader' "$strings_file"
          grep -q '4. Static Analyze Dylib' "$strings_file"
          ! grep -q 'method_setImplementation' "$strings_file"
          ! grep -q 'APP Bundle deep scanner installed' "$strings_file"
          ! otool -L "$out" | grep -q '/CoreGraphics.framework/'
          ! grep -q 'CheatGetMoney' "$strings_file"
          ! grep -q 'CheatLevelUp' "$strings_file"
          ! grep -q 'XPHero' "$strings_file"
          otool -L "$out" | tee hfamap/dist/v2.5.4-r2/LOAD_COMMANDS.txt
          shasum -a 256 "$out" | tee hfamap/dist/v2.5.4-r2/SHA256SUMS.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.5.4-r2-StableLoaderBundleScan
          path: |
            hfamap/dist/v2.5.4-r2/HFAMapUniversal-v2.5.4-r2.dylib
            hfamap/dist/v2.5.4-r2/SHA256SUMS.txt
            hfamap/dist/v2.5.4-r2/LOAD_COMMANDS.txt
          if-no-files-found: error
