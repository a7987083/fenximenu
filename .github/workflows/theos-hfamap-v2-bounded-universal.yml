name: HFAMap v2.4.2 Stripped Menu Static Suite

on:
  push:
    branches:
      - feature/hfamap-v2.4.2-stripped-menu-static-suite
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/theos-hfamap-v2-bounded-universal.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tools/*.py tests/*.py

      - name: Check source invariants
        run: |
          set -euo pipefail
          grep -q 'com.hfa.menu-binary-evidence/v3' hfamap/src/HFAMapImageProbe.mm
          grep -q 'strippedObjCInventory' hfamap/src/HFAMapImageProbe.mm
          grep -q 'analysisCapabilities' hfamap/src/HFAMapImageProbe.mm
          grep -q 'get_OrigBytes' hfamap/src/HFAMapImageProbe.mm
          grep -q 'findIdaPatternFirst' hfamap/src/HFAMapImageProbe.mm
          grep -q 'src/HFAMapStrippedActionAnalyzer.mm' hfamap/Makefile
          grep -q 'src/HFAMapObjCActionInventory.mm' hfamap/Makefile
          grep -q 'com.hfa.stripped-action/v1' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          grep -q 'kHFAActionMaxInstructions = 512' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          grep -q 'arm64-x0-x7-candidate' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          grep -q 'read-only-local-dataflow-no-hook-no-callback-invocation-no-memory-write' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          grep -q 'objc_copyClassNamesForImage' hfamap/src/HFAMapObjCActionInventory.mm
          grep -q 'class_copyMethodList' hfamap/src/HFAMapObjCActionInventory.mm
          grep -q '2.4.2-dev-stripped-menu-static-suite' hfamap/src/HFAMapDiagnostics.mm
          grep -q 'HFAMap v2.4.2-dev Stripped Static Suite' hfamap/src/HFAMapEntry.mm
          grep -q 'DobbyHook' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'DobbyDestroy' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          ! grep -q 'DobbyInstrument' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          ! grep -q 'direct-method-entry' hfamap/src/HFAIL2CPPRuntimeProbe.mm

      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.4.2-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib \
            hfamap/dist/v2.4.2-dev/HFAMapUniversal-v2.4.2-dev.dylib
          out=hfamap/dist/v2.4.2-dev/HFAMapUniversal-v2.4.2-dev.dylib
          strings_file="$RUNNER_TEMP/hfamap-v2.4.2.strings"
          file "$out" | grep -q arm64
          strings "$out" > "$strings_file"
          grep -q 'com.hfa.menu-binary-evidence/v3' "$strings_file"
          grep -q 'com.hfa.stripped-action/v1' "$strings_file"
          grep -q 'com.hfa.stripped-objc-inventory/v1' "$strings_file"
          grep -q 'arm64-x0-x7-candidate' "$strings_file"
          grep -q 'strippedObjCInventory' "$strings_file"
          grep -q 'HFAMap v2.4.2-dev Stripped Static Suite' "$strings_file"
          ! grep -q 'direct-method-entry' "$strings_file"
          shasum -a 256 "$out" | tee hfamap/dist/v2.4.2-dev/SHA256SUMS.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.4.2-StrippedMenuStaticSuite
          path: |
            hfamap/dist/v2.4.2-dev/HFAMapUniversal-v2.4.2-dev.dylib
            hfamap/dist/v2.4.2-dev/SHA256SUMS.txt
          if-no-files-found: error
