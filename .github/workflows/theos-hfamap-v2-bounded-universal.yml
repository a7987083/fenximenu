name: HFAMap v2.3.9 IL2CPP Runtime Resolver

on:
  push:
    branches:
      - feature/hfamap-v2.3.9-il2cpp-runtime-resolver
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/theos-hfamap-v2-bounded-universal.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tools/*.py tests/*.py

      - name: Check source invariants
        run: |
          set -euo pipefail
          grep -q 'kHFAMaxImages = 2048' hfamap/src/HFAMapImageProbe.mm
          grep -q 'src/HFAIL2CPPRuntimeProbe.mm' hfamap/Makefile
          grep -q 'src/HFAIL2CPPResolver.mm' hfamap/Makefile
          grep -q 'DobbyInstrument' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'DobbyDestroy' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'il2cpp_class_from_name' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'il2cpp_runtime_invoke' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'original ? original(method, object, arguments, exception)' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'kHFAIL2CPPMaxEvents = 512' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'kHFAIL2CPPMaxMappings = 256' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'kHFAIL2CPPMaxDirectInstruments = 96' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'kHFAIL2CPPResolverMaxClasses = 12000' hfamap/src/HFAIL2CPPResolver.mm

      - name: Build pinned Dobby arm64 static library
        run: |
          set -euo pipefail
          DOBBY_COMMIT=5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          git clone --recursive https://github.com/jmpews/Dobby.git "$RUNNER_TEMP/Dobby"
          git -C "$RUNNER_TEMP/Dobby" checkout "$DOBBY_COMMIT"
          git -C "$RUNNER_TEMP/Dobby" submodule update --init --recursive
          DOBBY_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cmake -S "$RUNNER_TEMP/Dobby" -B "$RUNNER_TEMP/Dobby/build-hfa-arm64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$DOBBY_SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DPlugin.SymbolResolver=OFF \
            -DDOBBY_BUILD_EXAMPLE=OFF \
            -DDOBBY_BUILD_TEST=OFF
          cmake --build "$RUNNER_TEMP/Dobby/build-hfa-arm64" \
            --config Release --target dobby_static --parallel 8
          mkdir -p hfamap/vendor/dobby/lib
          cp "$RUNNER_TEMP/Dobby/build-hfa-arm64/libdobby.a" \
            hfamap/vendor/dobby/lib/libdobby.a
          file hfamap/vendor/dobby/lib/libdobby.a
          shasum -a 256 hfamap/vendor/dobby/lib/libdobby.a

      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.3.9-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib \
            hfamap/dist/v2.3.9-dev/HFAMapUniversal-v2.3.9-dev.dylib
          out=hfamap/dist/v2.3.9-dev/HFAMapUniversal-v2.3.9-dev.dylib
          file "$out" | grep -q arm64
          strings "$out" | grep -q 'com.hfa.il2cpp-runtime-probe/v2'
          strings "$out" | grep -q 'com.hfa.il2cpp-runtime-resolver/v1'
          strings "$out" | grep -q 'direct-method-entry'
          strings "$out" | grep -q '2.3.9-dev-il2cpp-runtime-resolver'
          nm -gU "$out" | grep -q '_DobbyInstrument'
          nm -gU "$out" | grep -q '_DobbyDestroy'
          ! otool -L "$out" | grep -qi dobby
          otool -L "$out"
          shasum -a 256 "$out" | tee hfamap/dist/v2.3.9-dev/SHA256SUMS.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.3.9-IL2CPPRuntimeResolver
          path: |
            hfamap/dist/v2.3.9-dev/HFAMapUniversal-v2.3.9-dev.dylib
            hfamap/dist/v2.3.9-dev/SHA256SUMS.txt
          if-no-files-found: error
