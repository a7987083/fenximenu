name: HFAMap v2.5.7 Crash Safe Runtime Probe

on:
  push:
    branches:
      - feature/hfamap-v2.5.7-crash-safe-runtime-probe
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/theos-hfamap-v2-bounded-universal.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tools/*.py tests/*.py

      - name: Check source invariants
        run: |
          set -euo pipefail
          grep -q 'src/HFAMapFastDiscovery.mm' hfamap/Makefile
          grep -q 'src/HFAMapStaticCatalog.mm' hfamap/Makefile
          grep -q 'src/HFAMapStaticCatalogBridge.mm' hfamap/Makefile
          grep -q 'src/HFAMapDescriptorStaticCallbackResolver.mm' hfamap/Makefile
          grep -q 'src/HFAMapBundleRootScanner.mm' hfamap/Makefile
          grep -q 'src/HFAIL2CPPRuntimeProbeSafe.mm' hfamap/Makefile
          ! grep -q 'src/HFAIL2CPPRuntimeProbe.mm' hfamap/Makefile
          grep -q 'NSBundle.mainBundle.bundlePath' hfamap/src/HFAMapBundleRootScanner.mm
          grep -q 'kHFABundleScanMaxDepth = 12' hfamap/src/HFAMapBundleRootScanner.mm
          grep -q 'kHFABundleScanMaxFiles = 512' hfamap/src/HFAMapBundleRootScanner.mm
          grep -q '@"APP"' hfamap/src/HFAMapBundleRootScanner.mm
          grep -q '@"DATA"' hfamap/src/HFAMapBundleRootScanner.mm
          grep -q 'HFAMap v2.5.7-dev' hfamap/src/HFAMapEntry.mm
          grep -q '\[HFAMap\] v2.5.7 UI installed' hfamap/src/HFAMapEntry.mm
          grep -q 'HFAMap v2.5.7' hfamap/src/HFAMapBundleRootScanner.mm
          grep -q '\[HFAMap\] v2.5.7 APP Bundle deep scanner installed' hfamap/src/HFAMapBundleRootScanner.mm
          ! grep -q 'HFAMap v2.5.3' hfamap/src/HFAMapEntry.mm
          ! grep -q '\[HFAMap\] v2.5.3' hfamap/src/HFAMapEntry.mm
          ! grep -q 'HFAMap v2.5.4' hfamap/src/HFAMapBundleRootScanner.mm
          ! grep -q '\[HFAMap\] v2.5.4' hfamap/src/HFAMapBundleRootScanner.mm
          grep -q 'com.hfa.fast-menu-discovery/v1' hfamap/src/HFAMapFastDiscovery.mm
          grep -q 'HFAMapRunMenuDiscovery' hfamap/src/HFAMapCore.mm
          grep -q 'HFAMapRunSelectedDeepAnalysis' hfamap/src/HFAMapCore.mm
          grep -q 'HFAMapStaticCatalogAnnotateHandlerGraph' hfamap/src/HFAMapCore.mm
          grep -q '4. Static Analyze Dylib' hfamap/src/HFAMapEntry.mm
          grep -q 'com.hfa.static-catalog/v1' hfamap/src/HFAMapStaticCatalog.mm
          grep -q 'com.hfa.static-runtime-method/v1' hfamap/src/HFAMapStaticCatalog.mm
          grep -q 'offline-file-read-only-no-dlopen' hfamap/src/HFAMapStaticCatalog.mm
          grep -q 'com.hfa.descriptor-static-callback/v1' hfamap/src/HFAMapDescriptorStaticCallbackResolver.mm
          grep -q '2.5.7-dev-crash-safe-runtime-probe' hfamap/src/HFAIL2CPPRuntimeProbeSafe.mm
          grep -q 'fail-closed-no-inline-backend-no-il2cpp-export-hook' hfamap/src/HFAIL2CPPRuntimeProbeSafe.mm
          grep -q '@"runtimeInvokeHooked": @NO' hfamap/src/HFAIL2CPPRuntimeProbeSafe.mm
          grep -q '@"hookInstalled": @NO' hfamap/src/HFAIL2CPPRuntimeProbeSafe.mm
          grep -q '@"memoryWritten": @NO' hfamap/src/HFAIL2CPPRuntimeProbeSafe.mm
          ! grep -q 'DobbyHook' hfamap/src/HFAIL2CPPRuntimeProbeSafe.mm
          ! grep -q 'DobbyDestroy' hfamap/src/HFAIL2CPPRuntimeProbeSafe.mm
          ! grep -q 'il2cpp_runtime_invoke' hfamap/src/HFAIL2CPPRuntimeProbeSafe.mm
          ! grep -q 'vm_write' hfamap/src/HFAIL2CPPRuntimeProbeSafe.mm
          ! grep -q 'CheatGetMoney' hfamap/src/HFAMapDescriptorStaticCallbackResolver.mm
          ! grep -q 'CheatLevelUp' hfamap/src/HFAMapDescriptorStaticCallbackResolver.mm
          ! grep -q 'XPHero' hfamap/src/HFAMapDescriptorStaticCallbackResolver.mm
          ! grep -q '0xB8B608' hfamap/src/HFAMapDescriptorStaticCallbackResolver.mm
          ! grep -q '0xB8BA50' hfamap/src/HFAMapDescriptorStaticCallbackResolver.mm

      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.5.7-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib \
            hfamap/dist/v2.5.7-dev/HFAMapUniversal-v2.5.7-dev.dylib
          out=hfamap/dist/v2.5.7-dev/HFAMapUniversal-v2.5.7-dev.dylib
          strings_file="$RUNNER_TEMP/hfamap-v2.5.7.strings"
          file "$out" | grep -q arm64
          strings "$out" > "$strings_file"
          grep -q 'com.hfa.static-catalog/v1' "$strings_file"
          grep -q 'com.hfa.static-runtime-method/v1' "$strings_file"
          grep -q 'com.hfa.descriptor-static-callback/v1' "$strings_file"
          grep -q '2.5.7-dev-crash-safe-runtime-probe' "$strings_file"
          grep -q 'HFAMap v2.5.7-dev' "$strings_file"
          grep -q '\[HFAMap\] v2.5.7 UI installed' "$strings_file"
          grep -q 'HFAMap v2.5.7' "$strings_file"
          grep -q '\[HFAMap\] v2.5.7 APP Bundle deep scanner installed' "$strings_file"
          grep -q 'fail-closed-no-inline-backend-no-il2cpp-export-hook' "$strings_file"
          ! grep -q 'HFAMap v2.5.3' "$strings_file"
          ! grep -q '\[HFAMap\] v2.5.3' "$strings_file"
          ! grep -q 'HFAMap v2.5.4' "$strings_file"
          ! grep -q '\[HFAMap\] v2.5.4' "$strings_file"
          ! grep -q 'CheatGetMoney' "$strings_file"
          ! grep -q 'CheatLevelUp' "$strings_file"
          ! grep -q 'XPHero' "$strings_file"
          shasum -a 256 "$out" | tee hfamap/dist/v2.5.7-dev/SHA256SUMS.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.5.7-CrashSafeRuntimeProbe
          path: |
            hfamap/dist/v2.5.7-dev/HFAMapUniversal-v2.5.7-dev.dylib
            hfamap/dist/v2.5.7-dev/SHA256SUMS.txt
          if-no-files-found: error
