name: HFAMap v2.4.3 Runtime Action Correlator

on:
  push:
    branches:
      - feature/hfamap-v2.4.3-runtime-action-correlator
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/theos-hfamap-v2-bounded-universal.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tools/*.py tests/*.py

      - name: Check source invariants
        run: |
          set -euo pipefail
          grep -q 'src/HFAIL2CPPMethodIndex.mm' hfamap/Makefile
          grep -q 'com.hfa.il2cpp-method-index/v1' hfamap/src/HFAIL2CPPMethodIndex.mm
          grep -q 'kHFAMaxMethods = 32768' hfamap/src/HFAIL2CPPMethodIndex.mm
          grep -q 'methodinfo-first-word-readonly-fallback' hfamap/src/HFAIL2CPPMethodIndex.mm
          grep -q 'read-only-il2cpp-metadata-enumeration-no-runtime-invoke-no-hook-no-memory-write' hfamap/src/HFAIL2CPPMethodIndex.mm
          grep -q 'com.hfa.stripped-action/v2' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          grep -q 'BLR Xn' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          grep -q '0xd63f0000U' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          grep -q 'exact-method-pointer-address' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          grep -q 'assembly-csharp-method-pointer-correlation' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          grep -q '2.4.3-dev-runtime-action-correlator' hfamap/src/HFAMapDiagnostics.mm
          grep -q 'HFAMap v2.4.3-dev Runtime Action Correlator' hfamap/src/HFAMapEntry.mm
          grep -q 'DobbyHook' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'DobbyDestroy' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          ! grep -q 'DobbyInstrument' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          ! grep -q 'direct-method-entry' hfamap/src/HFAIL2CPPRuntimeProbe.mm

      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.4.3-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib \
            hfamap/dist/v2.4.3-dev/HFAMapUniversal-v2.4.3-dev.dylib
          out=hfamap/dist/v2.4.3-dev/HFAMapUniversal-v2.4.3-dev.dylib
          strings_file="$RUNNER_TEMP/hfamap-v2.4.3.strings"
          file "$out" | grep -q arm64
          strings "$out" > "$strings_file"
          grep -q 'com.hfa.il2cpp-method-index/v1' "$strings_file"
          grep -q 'com.hfa.stripped-action/v2' "$strings_file"
          grep -q 'assembly-csharp-method-pointer-correlation' "$strings_file"
          grep -q 'exact-method-pointer-address' "$strings_file"
          grep -q 'HFAMap v2.4.3-dev Runtime Action Correlator' "$strings_file"
          ! grep -q 'direct-method-entry' "$strings_file"
          shasum -a 256 "$out" | tee hfamap/dist/v2.4.3-dev/SHA256SUMS.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.4.3-RuntimeActionCorrelator
          path: |
            hfamap/dist/v2.4.3-dev/HFAMapUniversal-v2.4.3-dev.dylib
            hfamap/dist/v2.4.3-dev/SHA256SUMS.txt
          if-no-files-found: error
