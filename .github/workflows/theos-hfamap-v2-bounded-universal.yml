name: HFAMap v2.4.0 Menu Binary Evidence

on:
  push:
    branches:
      - feature/hfamap-v2.4.0-menu-binary-evidence
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/theos-hfamap-v2-bounded-universal.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tools/*.py tests/*.py

      - name: Check source invariants
        run: |
          set -euo pipefail
          grep -q 'kHFAMaxImages = 2048' hfamap/src/HFAMapImageProbe.mm
          grep -q 'com.hfa.menu-binary-evidence/v1' hfamap/src/HFAMapImageProbe.mm
          grep -q 'MemoryPatch' hfamap/src/HFAMapImageProbe.mm
          grep -q 'createWithHex' hfamap/src/HFAMapImageProbe.mm
          grep -q 'createWithBytes' hfamap/src/HFAMapImageProbe.mm
          grep -q 'createWithAsm' hfamap/src/HFAMapImageProbe.mm
          grep -q 'memorypatch-menu' hfamap/src/HFAMapImageProbe.mm
          grep -q 'patchPrimitiveEvidenceOnly' hfamap/src/HFAMapImageProbe.mm
          grep -q 'src/HFAMapMenuBinaryAnalyzer.mm' hfamap/Makefile
          grep -q 'com.hfa.menu-callgraph/v1' hfamap/src/HFAMapMenuBinaryAnalyzer.mm
          grep -q 'LC_SYMTAB' hfamap/src/HFAMapMenuBinaryAnalyzer.mm
          grep -q 'SEG_LINKEDIT' hfamap/src/HFAMapMenuBinaryAnalyzer.mm
          grep -q 'MemoryPatch13createWithHex' hfamap/src/HFAMapMenuBinaryAnalyzer.mm
          grep -q 'arm64-direct-bl' hfamap/src/HFAMapMenuBinaryAnalyzer.mm
          grep -q 'directPatchCallEdges' hfamap/src/HFAMapMenuBinaryAnalyzer.mm
          grep -q 'menuCallGraph' hfamap/src/HFAMapImageProbe.mm
          grep -q 'src/HFAIL2CPPRuntimeProbe.mm' hfamap/Makefile
          grep -q 'DobbyHook' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'DobbyDestroy' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          ! grep -q 'DobbyInstrument' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          ! grep -q 'direct-method-entry' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'il2cpp_class_from_name' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'il2cpp_runtime_invoke' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'original ? original(method, object, arguments, exception)' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'kHFAIL2CPPMaxEvents = 256' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'kHFAIL2CPPMaxMappings = 256' hfamap/src/HFAIL2CPPRuntimeProbe.mm

      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.4.0-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib \
            hfamap/dist/v2.4.0-dev/HFAMapUniversal-v2.4.0-dev.dylib
          out=hfamap/dist/v2.4.0-dev/HFAMapUniversal-v2.4.0-dev.dylib
          strings_file="$RUNNER_TEMP/hfamap-v2.4.0.strings"
          file "$out" | grep -q arm64
          strings "$out" > "$strings_file"
          grep -q 'com.hfa.il2cpp-runtime-probe/v1' "$strings_file"
          grep -q 'com.hfa.menu-binary-evidence/v1' "$strings_file"
          grep -q 'com.hfa.menu-callgraph/v1' "$strings_file"
          grep -q 'directPatchCallEdges' "$strings_file"
          grep -q 'arm64-direct-bl' "$strings_file"
          grep -q 'MemoryPatch' "$strings_file"
          grep -q 'memorypatch-menu' "$strings_file"
          grep -q 'HFAMap v2.4.0-dev Menu Binary Evidence' "$strings_file"
          ! grep -q 'direct-method-entry' "$strings_file"
          shasum -a 256 "$out" | tee hfamap/dist/v2.4.0-dev/SHA256SUMS.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.4.0-MenuBinaryEvidence
          path: |
            hfamap/dist/v2.4.0-dev/HFAMapUniversal-v2.4.0-dev.dylib
            hfamap/dist/v2.4.0-dev/SHA256SUMS.txt
          if-no-files-found: error
