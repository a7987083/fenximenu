name: HFAMap v2.4.5 Dispatcher CFG Correlator

on:
  push:
    branches:
      - feature/hfamap-v2.4.5-dispatcher-cfg-hwbp-correlator
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/theos-hfamap-v2-bounded-universal.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tools/*.py tests/*.py

      - name: Check source invariants
        run: |
          set -euo pipefail
          grep -q 'src/HFAIL2CPPMethodIndex.mm' hfamap/Makefile
          grep -q 'com.hfa.il2cpp-method-index/v1' hfamap/src/HFAIL2CPPMethodIndex.mm
          grep -q 'kHFAMaxMethods = 32768' hfamap/src/HFAIL2CPPMethodIndex.mm
          grep -q 'MethodInfo\[%lu\]' hfamap/src/HFAIL2CPPMethodIndex.mm
          grep -q 'HFAExecutableUnityAddress' hfamap/src/HFAIL2CPPMethodIndex.mm
          grep -q 'unityExecutableSegmentValidation' hfamap/src/HFAIL2CPPMethodIndex.mm
          grep -q 'com.hfa.stripped-action/v3' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          grep -q 'bounded-cfg-worklist' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          grep -q 'BR Xn' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          grep -q '0xd61f0000U' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          grep -q '0xd63f0000U' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          grep -q 'same-image-helper-traversal' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          grep -q 'verify.dylib-arm64-relocation-and-register-context-coverage' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          grep -q 'exact-method-pointer-address' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          grep -q 'assembly-csharp-method-pointer-correlation' hfamap/src/HFAMapStrippedActionAnalyzer.mm
          grep -q 'gHFAIL2CPPSessionActive' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'featureDirectedAnalysisRequiresHook' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'exact-user-activated-control-target-action' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q '2.4.5-dev-dispatcher-cfg-correlator' hfamap/src/HFAMapDiagnostics.mm
          grep -q 'HFAMap v2.4.5-dev Dispatcher CFG' hfamap/src/HFAMapEntry.mm
          ! grep -q 'DobbyInstrument' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          ! grep -q 'direct-method-entry' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          ! grep -q 'vm_write' hfamap/src/HFAIL2CPPRuntimeProbe.mm

      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.4.5-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib \
            hfamap/dist/v2.4.5-dev/HFAMapUniversal-v2.4.5-dev.dylib
          out=hfamap/dist/v2.4.5-dev/HFAMapUniversal-v2.4.5-dev.dylib
          strings_file="$RUNNER_TEMP/hfamap-v2.4.5.strings"
          file "$out" | grep -q arm64
          strings "$out" > "$strings_file"
          grep -q 'com.hfa.il2cpp-method-index/v1' "$strings_file"
          grep -q 'com.hfa.stripped-action/v3' "$strings_file"
          grep -q 'bounded-cfg-worklist' "$strings_file"
          grep -q 'same-image-helper-traversal' "$strings_file"
          grep -q 'assembly-csharp-method-pointer-correlation' "$strings_file"
          grep -q 'HFAMap v2.4.5-dev Dispatcher CFG' "$strings_file"
          ! grep -q 'direct-method-entry' "$strings_file"
          shasum -a 256 "$out" | tee hfamap/dist/v2.4.5-dev/SHA256SUMS.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.4.5-DispatcherCFGCorrelator
          path: |
            hfamap/dist/v2.4.5-dev/HFAMapUniversal-v2.4.5-dev.dylib
            hfamap/dist/v2.4.5-dev/SHA256SUMS.txt
          if-no-files-found: error
