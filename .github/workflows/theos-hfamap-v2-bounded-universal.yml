name: HFAMap v2.3.8 Dual Runtime Probe

on:
  push:
    branches:
      - feature/hfamap-v2-bounded-universal-analyzer
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/theos-hfamap-v2-bounded-universal.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tools/*.py tests/*.py

      - name: Check source invariants
        run: |
          set -euo pipefail
          grep -q 'kHFAMaxImages = 2048' hfamap/src/HFAMapImageProbe.mm
          grep -q 'src/HFAIL2CPPRuntimeProbe.mm' hfamap/Makefile
          grep -q 'DobbyHook' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'DobbyDestroy' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'il2cpp_class_from_name' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'il2cpp_runtime_invoke' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'original ? original(method, object, arguments, exception)' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'kHFAIL2CPPMaxEvents = 256' hfamap/src/HFAIL2CPPRuntimeProbe.mm
          grep -q 'kHFAIL2CPPMaxMappings = 256' hfamap/src/HFAIL2CPPRuntimeProbe.mm

      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.3.8-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib \
            hfamap/dist/v2.3.8-dev/HFAMapUniversal-v2.3.8-dev.dylib
          file hfamap/dist/v2.3.8-dev/HFAMapUniversal-v2.3.8-dev.dylib
          strings hfamap/dist/v2.3.8-dev/HFAMapUniversal-v2.3.8-dev.dylib | grep -q 'com.hfa.il2cpp-runtime-probe/v1'
          strings hfamap/dist/v2.3.8-dev/HFAMapUniversal-v2.3.8-dev.dylib | grep -q 'il2cpp_class_from_name'
          strings hfamap/dist/v2.3.8-dev/HFAMapUniversal-v2.3.8-dev.dylib | grep -q 'il2cpp_runtime_invoke'
          strings hfamap/dist/v2.3.8-dev/HFAMapUniversal-v2.3.8-dev.dylib | grep -q '2.3.8-dev-dual-runtime-probe'
          shasum -a 256 hfamap/dist/v2.3.8-dev/HFAMapUniversal-v2.3.8-dev.dylib \
            | tee hfamap/dist/v2.3.8-dev/SHA256SUMS.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.3.8-DualRuntimeProbe
          path: |
            hfamap/dist/v2.3.8-dev/HFAMapUniversal-v2.3.8-dev.dylib
            hfamap/dist/v2.3.8-dev/SHA256SUMS.txt
          if-no-files-found: error
