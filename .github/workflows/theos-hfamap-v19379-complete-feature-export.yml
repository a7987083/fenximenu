name: HFAMapUniversal v1.9.37.9 CompleteFeatureExport

on:
  push:
    branches:
      - feature/hfamap-v19379-complete-feature-export
    paths:
      - 'hfamap/**'
      - '.github/scripts/hfamap_v*.py'
      - '.github/scripts/apply_hfamap_v*.py'
      - '.github/workflows/theos-hfamap-v19379-complete-feature-export.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate v1.9.37.9
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_hfamap_v1936_chain.py
          python3 .github/scripts/hfamap_v19361_json_export.py
          python3 .github/scripts/hfamap_v19367_dynamic_apply_local.py
          python3 .github/scripts/hfamap_v19367_secret_callgraph_local.py
          python3 .github/scripts/hfamap_v19367_app_local_menu_resolver.py
          python3 .github/scripts/hfamap_v19367_ui_cleanup.py
          python3 .github/scripts/hfamap_v19367_trace_cleanup.py
          python3 .github/scripts/hfamap_v19367_generic_cleanup.py
          python3 .github/scripts/hfamap_v19368_family_menu_resolver.py
          python3 .github/scripts/apply_hfamap_v19370.py
          python3 .github/scripts/hfamap_v19371_5m_dispatcher_resolver.py
          python3 .github/scripts/hfamap_v19372_5m_dual_backend_fix.py
          python3 .github/scripts/hfamap_v19373_app_local_dylib_discovery_v2.py
          python3 .github/scripts/hfamap_v19374_prepare_patch.py
          python3 .github/scripts/hfamap_v19374_manual_candidate_selection.py
          python3 .github/scripts/hfamap_v19374_finalize_markers.py
          python3 .github/scripts/hfamap_v19375_loaded_macho_dependency_discovery.py
          python3 .github/scripts/hfamap_v19376_loaded_image_fingerprint.py
          python3 .github/scripts/hfamap_v19377_two_stage_class_metadata_scan.py
          python3 .github/scripts/hfamap_v19378_structural_relation_expansion.py
          cp hfamap/src/HFAMapFamilyRuntimeResolver.m /tmp/family.before19379
          cp hfamap/src/HFAMapJailpatchRuntimeProfiler.m /tmp/profiler.before19379
          cp hfamap/src/HFAMap5MDispatcherResolver.m /tmp/dispatch.before19379
          cp hfamap/src/HFAMapPatchExecutionTrace.m /tmp/trace.before19379
          python3 .github/scripts/hfamap_v19379_complete_feature_export.py
          git diff --check

      - name: Verify current-scan observed reset
        run: |
          set -euo pipefail
          grep -q '\[OBSERVED-RESET\]' hfamap/src/HFAMapFamilyRuntimeResolver.m
          grep -q 'HFAMap_MenuMap.jsonl' hfamap/src/HFAMapFamilyRuntimeResolver.m
          grep -q 'removeItemAtPath:observedMenuPath' hfamap/src/HFAMapFamilyRuntimeResolver.m

      - name: Verify complete feature merge
        run: |
          set -euo pipefail
          f=hfamap/src/HFAMapJSONExport.m
          grep -q 'HFAJSONObservedFeatures' "$f"
          grep -q 'HFAJSONMergeFeatures' "$f"
          grep -q 'runtime-observed-feature' "$f"
          grep -q 'runtime-observed-action' "$f"
          grep -q 'runtimeAction' "$f"
          grep -q '\[JSON-EXPORT-OBSERVED\]' "$f"
          grep -q 'observed-runtime' "$f"
          grep -q 'seenFeatureIDs' "$f"
          grep -q 'HFAJSONCollectImages(observed' "$f"
          grep -q 'HFAMapUniversal v1.9.37.9 CompleteFeatureExport' "$f"

      - name: Verify precedence and scan backends unchanged
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('hfamap/src/HFAMapJSONExport.m').read_text()
          c = s.index('HFAJSONMergeFeatures(features, seenFeatureIDs, HFAJSONCanonicalFeatures')
          i = s.index('HFAJSONMergeFeatures(features, seenFeatureIDs, HFAJSONIGMMFeatures')
          o = s.index('HFAJSONMergeFeatures(features, seenFeatureIDs, observed')
          if not (c < i < o):
              raise SystemExit('feature precedence is not canonical > IGMM > observed')
          PY
          cmp /tmp/profiler.before19379 hfamap/src/HFAMapJailpatchRuntimeProfiler.m
          cmp /tmp/dispatch.before19379 hfamap/src/HFAMap5MDispatcherResolver.m
          cmp /tmp/trace.before19379 hfamap/src/HFAMapPatchExecutionTrace.m
          # FamilyResolver is allowed to differ only for the current-scan MenuMap reset.
          diff -u /tmp/family.before19379 hfamap/src/HFAMapFamilyRuntimeResolver.m > /tmp/family.diff || true
          grep -q 'HFAMap_MenuMap.jsonl' /tmp/family.diff

      - name: Verify no broad scan regression
        run: |
          set -euo pipefail
          if grep -R -n 'objc_getClassList\|objc_copyClassList\|_dyld_register_func_for_add_image' hfamap/src; then
            echo 'forbidden process-wide scan/listener present'; exit 1
          fi

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build HFAMapUniversal v1.9.37.9
        run: |
          set -euo pipefail
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out='dist/HFAMapUniversal_v1.9.37.9_CompleteFeatureExport.dylib'
          cp .theos/obj/HFAMapUniversal.dylib "$out"
          file "$out"
          shasum -a 256 "$out" | tee dist/SHA256_v1.9.37.9.txt
          strings "$out" > dist/strings_v1.9.37.9.txt
          nm -u "$out" > dist/nm_undefined_v1.9.37.9.txt
          grep -q 'v1.9.37.9 CompleteFeatureExport' dist/strings_v1.9.37.9.txt
          grep -q 'JSON-EXPORT-OBSERVED' dist/strings_v1.9.37.9.txt
          grep -q 'runtime-observed-action' dist/strings_v1.9.37.9.txt
          grep -q 'HFAMap_MenuMap.jsonl' dist/strings_v1.9.37.9.txt
          if grep -Eq '_objc_getClassList|_objc_copyClassList|_dyld_register_func_for_add_image' dist/nm_undefined_v1.9.37.9.txt; then
            echo 'forbidden symbol leaked into final dylib'; exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v1.9.37.9-CompleteFeatureExport
          path: |
            hfamap/dist/HFAMapUniversal_v1.9.37.9_CompleteFeatureExport.dylib
            hfamap/dist/SHA256_v1.9.37.9.txt
          if-no-files-found: error
