name: HFAMap v2.5.11 Secret Wrapper Evidence

on:
  push:
    branches:
      - feature/hfamap-v2.5.11-secret-wrapper-evidence
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - '.github/workflows/theos-hfamap-v2.5.11-secret-wrapper-evidence.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tests/*.py
      - name: Check v2.5.11 invariants
        run: |
          set -euo pipefail
          grep -q 'src/HFAMapSecretWrapperEvidenceResolver.mm' hfamap/Makefile
          grep -q 'src/HFAMapVersion2511.mm' hfamap/Makefile
          grep -q 'UNIVERSAL-SECRET-WRAPPER-READ-ONLY-NO-INTERNAL-CALLS' hfamap/src/HFAMapSecretWrapperEvidenceResolver.mm
          grep -q 'com.hfa.secret-wrapper-evidence/v1' hfamap/src/HFAMapSecretWrapperEvidenceResolver.mm
          grep -q 'SecretWrapperEvidence.json' hfamap/src/HFAMapSecretWrapperEvidenceResolver.mm
          ! grep -q 'objc_msgSend' hfamap/src/HFAMapSecretWrapperEvidenceResolver.mm
          ! grep -q 'DobbyHook' hfamap/src/HFAMapSecretWrapperEvidenceResolver.mm
          ! grep -q 'MSHookFunction' hfamap/src/HFAMapSecretWrapperEvidenceResolver.mm
          ! grep -q 'RogueLegend' hfamap/src/HFAMapSecretWrapperEvidenceResolver.mm
          ! grep -q '0x31AFD14' hfamap/src/HFAMapSecretWrapperEvidenceResolver.mm
          ! grep -q '0x3593500' hfamap/src/HFAMapSecretWrapperEvidenceResolver.mm
      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.5.11-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib hfamap/dist/v2.5.11-dev/HFAMapUniversal-v2.5.11-dev.dylib
          out=hfamap/dist/v2.5.11-dev/HFAMapUniversal-v2.5.11-dev.dylib
          strings "$out" > "$RUNNER_TEMP/hfamap2511.strings"
          file "$out" | grep -q arm64
          grep -q 'HFAMap v2.5.11-dev' "$RUNNER_TEMP/hfamap2511.strings"
          grep -q '2.5.11-dev-secret-wrapper-static-evidence' "$RUNNER_TEMP/hfamap2511.strings"
          grep -q 'com.hfa.secret-wrapper-evidence/v1' "$RUNNER_TEMP/hfamap2511.strings"
          grep -q 'UNIVERSAL-SECRET-WRAPPER-READ-ONLY-NO-INTERNAL-CALLS' "$RUNNER_TEMP/hfamap2511.strings"
          shasum -a 256 "$out" | tee hfamap/dist/v2.5.11-dev/SHA256SUMS.txt
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.5.11-SecretWrapperEvidence
          path: |
            hfamap/dist/v2.5.11-dev/HFAMapUniversal-v2.5.11-dev.dylib
            hfamap/dist/v2.5.11-dev/SHA256SUMS.txt
          if-no-files-found: error
