name: HFAMapUniversal Universal Mutation Refactor

on:
  push:
    branches:
      - feature/universal-mutation-refactor
    paths:
      - 'hfamap/**'
      - '.github/scripts/hfamap_v*.py'
      - '.github/scripts/apply_hfamap_v*.py'
      - '.github/workflows/theos-hfamap-universal-mutation-refactor.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate verified baseline and mutation IR bridge
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_hfamap_v1936_chain.py
          python3 .github/scripts/hfamap_v19361_json_export.py
          python3 .github/scripts/hfamap_v19367_dynamic_apply_local.py
          python3 .github/scripts/hfamap_v19367_secret_callgraph_local.py
          python3 .github/scripts/hfamap_v19367_app_local_menu_resolver.py
          python3 .github/scripts/hfamap_v19367_ui_cleanup.py
          python3 .github/scripts/hfamap_v19367_trace_cleanup.py
          python3 .github/scripts/hfamap_v19367_generic_cleanup.py
          python3 .github/scripts/hfamap_v19368_family_menu_resolver.py
          python3 .github/scripts/apply_hfamap_v19370.py
          python3 .github/scripts/hfamap_v19371_5m_dispatcher_resolver.py
          python3 .github/scripts/hfamap_v19372_5m_dual_backend_fix.py
          python3 .github/scripts/hfamap_v19373_app_local_dylib_discovery_v2.py
          python3 .github/scripts/hfamap_v19374_prepare_patch.py
          python3 .github/scripts/hfamap_v19374_manual_candidate_selection.py
          python3 .github/scripts/hfamap_v19374_finalize_markers.py
          python3 .github/scripts/hfamap_v19375_loaded_macho_dependency_discovery.py
          python3 .github/scripts/hfamap_v19376_loaded_image_fingerprint.py
          python3 .github/scripts/hfamap_v19377_two_stage_class_metadata_scan.py
          python3 .github/scripts/hfamap_v19378_structural_relation_expansion.py
          python3 .github/scripts/hfamap_v19379_complete_feature_export.py
          python3 .github/scripts/hfamap_v193710_unified_feature_model.py
          python3 .github/scripts/hfamap_v193710_earntodie_verified_profile.py
          python3 .github/scripts/hfamap_v19380_canonical_mutation_ir.py
          git diff --check

      - name: Verify mutation IR integration
        run: |
          set -euo pipefail
          grep -q 'src/HFACanonicalMutation.m' hfamap/Makefile
          grep -q 'HFACanonicalMutation.h' hfamap/src/HFAMapPatchExecutionTrace.m
          grep -q 'HFAIngestCanonicalPackage(exportFeatures, exportTargets' hfamap/src/HFAMapPatchExecutionTrace.m
          grep -q 'HFAFlushCanonicalMutations' hfamap/src/HFAMapPatchExecutionTrace.m
          grep -q 'com.hfa.mutation/v1' hfamap/src/HFACanonicalMutation.m
          grep -q 'original-enabled-byte-difference-validated' hfamap/src/HFACanonicalMutation.m
          if grep -Eq 'IGSecretInt|IGCodePatch|APPatchItem|Jailpatch' hfamap/src/HFACanonicalMutation.m; then
            echo 'canonical mutation core depends on provider-specific framework names'; exit 1
          fi

      - name: Verify original truth gates remain
        run: |
          set -euo pipefail
          f=hfamap/src/HFAMapPatchExecutionTrace.m
          grep -q 'HFAReadOriginalBytes' "$f"
          grep -q 'HFAWritePatchPackage(exportFeatures, exportTargets)' "$f"
          grep -q '8654D76C-B760-34FC-BEE0-FE70AE8C95C8' "$f"
          grep -q '0x2D98AC8' "$f"
          grep -q '0x2D9887C' "$f"

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build
        run: |
          set -euo pipefail
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out='dist/HFAMapUniversal_UniversalMutationRefactor.dylib'
          cp .theos/obj/HFAMapUniversal.dylib "$out"
          file "$out"
          shasum -a 256 "$out" | tee dist/SHA256_UniversalMutationRefactor.txt
          strings "$out" > dist/strings_UniversalMutationRefactor.txt
          nm -u "$out" > dist/nm_undefined_UniversalMutationRefactor.txt
          grep -q 'com.hfa.mutation/v1' dist/strings_UniversalMutationRefactor.txt
          grep -q 'MUTATION-IR-INGEST' dist/strings_UniversalMutationRefactor.txt
          grep -q 'MUTATION-IR-FLUSH' dist/strings_UniversalMutationRefactor.txt
          if grep -Eq '_objc_getClassList|_objc_copyClassList|_dyld_register_func_for_add_image' dist/nm_undefined_UniversalMutationRefactor.txt; then
            echo 'forbidden broad scan/listener leaked into final dylib'; exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-UniversalMutationRefactor
          path: |
            hfamap/dist/HFAMapUniversal_UniversalMutationRefactor.dylib
            hfamap/dist/SHA256_UniversalMutationRefactor.txt
          if-no-files-found: error
