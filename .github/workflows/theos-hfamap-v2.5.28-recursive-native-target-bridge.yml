name: HFAMap v2.5.28 Recursive Native Target Bridge

on:
  push:
    branches:
      - feature/hfamap-v2.5.28-recursive-native-target-bridge
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - '.github/workflows/theos-hfamap-v2.5.28-recursive-native-target-bridge.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tests/*.py

      - name: Check v2.5.28 invariants
        run: |
          set -euo pipefail
          grep -q '2.5.28-dev-recursive-native-target-bridge' hfamap/src/HFAMapBuildInfo.mm
          grep -q 'HFAMapRecursiveNativeTargetResolver.mm' hfamap/Makefile
          grep -q 'HFAMapResolveRecursiveNativeTarget' hfamap/src/HFAMapNativeConsumerTargetBridge.mm
          grep -q 'recursiveTargetEvidence' hfamap/src/HFAMapNativeConsumerTargetBridge.mm
          grep -q 'native-consumer-target-bridge/v2' hfamap/src/HFAMapNativeConsumerTargetBridge.mm
          grep -q 'cycle-detected' hfamap/src/HFAMapRecursiveNativeTargetResolver.mm
          grep -q 'ambiguous-multiple-next-targets' hfamap/src/HFAMapRecursiveNativeTargetResolver.mm
          grep -q 'ADRP+LDR+BR' hfamap/src/HFAMapRecursiveNativeTargetResolver.mm
          grep -q 'LDR-literal+BR' hfamap/src/HFAMapRecursiveNativeTargetResolver.mm
          grep -q 'HFAIL2CPPMethodContainingRuntimeAddress' hfamap/src/HFAMapRecursiveNativeTargetResolver.mm
          grep -q 'HFAOutputDirectoryPath' hfamap/src/HFAMapRuntimeProbe.mm
          grep -q 'HFAOutputDirectoryPath' hfamap/src/HFAExactRuntimeMethodTrace.mm

      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/HFAMapUniversal-v2.5.28-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib hfamap/dist/HFAMapUniversal-v2.5.28-dev/HFAMapUniversal-v2.5.28-dev.dylib
          out=hfamap/dist/HFAMapUniversal-v2.5.28-dev/HFAMapUniversal-v2.5.28-dev.dylib
          strings "$out" > "$RUNNER_TEMP/hfamap2528.strings"
          file "$out" | grep -q arm64
          grep -q '2.5.28-dev-recursive-native-target-bridge' "$RUNNER_TEMP/hfamap2528.strings"
          grep -q 'bounded-executable-only+unique-edge-only+cycle-detection+fail-closed' "$RUNNER_TEMP/hfamap2528.strings"
          shasum -a 256 "$out" | tee hfamap/dist/HFAMapUniversal-v2.5.28-dev/SHA256SUMS.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.5.28-RecursiveNativeTargetBridge
          path: |
            hfamap/dist/HFAMapUniversal-v2.5.28-dev/HFAMapUniversal-v2.5.28-dev.dylib
            hfamap/dist/HFAMapUniversal-v2.5.28-dev/SHA256SUMS.txt
          if-no-files-found: error
