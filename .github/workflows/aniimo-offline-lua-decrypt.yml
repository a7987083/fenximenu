name: Aniimo Offline Lua Decrypt

on:
  push:
    branches:
      - analysis/aniimo-offline-lua-decrypt-20261004
    paths:
      - 'analysis/**'
      - '.github/workflows/aniimo-offline-lua-decrypt.yml'
  workflow_dispatch:

jobs:
  run-offline-core:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify arm64 host
        run: |
          set -euo pipefail
          uname -a
          test "$(uname -m)" = "arm64"

      - name: Decode extracted payloads
        run: |
          set -euo pipefail
          cd analysis
          python3 - <<'PY'
          import json,base64,pathlib
          p=json.load(open("aniimo_payloads.json","r"))
          pathlib.Path("core.bin").write_bytes(base64.b64decode(p["core"]))
          pathlib.Path("sigma.bin").write_bytes(base64.b64decode(p["sigma"]))
          for k,v in p.items():
              if k in ("core","sigma"): continue
              pathlib.Path("blob_"+k+".bin").write_bytes(base64.b64decode(v))
          # Reassemble the large encrypted script from split analysis objects.
          parts=[]
          for i in (0,1):
              parts.append(base64.b64decode(pathlib.Path(f"big_blob_{i}.b64").read_text().strip()))
          for i in (2,3,4):
              parts.append(pathlib.Path(f"big_blob_{i}.bin").read_bytes())
          big=b"".join(parts)
          pathlib.Path("blob_big_script.bin").write_bytes(big)
          print("core",pathlib.Path("core.bin").stat().st_size)
          print("big_blob",len(big))
          assert len(big)==0x32d8
          PY

      - name: Build offline harness
        run: |
          set -euo pipefail
          cd analysis
          clang -O2 -Wall -Wextra -arch arm64 aniimo_offline_decrypt.c -o aniimo_offline_decrypt
          file aniimo_offline_decrypt

      - name: Execute original decrypt core
        run: |
          set -euo pipefail
          cd analysis
          ./aniimo_offline_decrypt | tee aniimo_offline_result.txt

      - name: Inspect recovered Lua
        run: |
          set -euo pipefail
          cd analysis
          wc -c aniimo_big.lua
          shasum -a 256 aniimo_big.lua
          grep -n -E '_AGM|tick|god|hits|nocd|energy|stamina|nofall|speed|qte|sneak|skip|cam|fps' aniimo_big.lua | head -n 200 || true

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: aniimo-offline-decrypt-result
          path: |
            analysis/aniimo_offline_result.txt
            analysis/aniimo_big.lua
          if-no-files-found: error
