name: HFAMapUniversal v1.9.36.5 JSONExport Delay5s

on:
  push:
    branches:
      - feature/hfamap-v19361-json-export
    paths:
      - 'hfamap/**'
      - '.github/scripts/hfamap_v19361_json_export.py'
      - '.github/scripts/hfamap_v*.py'
      - '.github/scripts/apply_hfamap_v1933_chain.py'
      - '.github/scripts/apply_hfamap_v1934_chain.py'
      - '.github/scripts/apply_hfamap_v1935_chain.py'
      - '.github/scripts/apply_hfamap_v1936_chain.py'
      - '.github/workflows/theos-hfamap-v19361-json-export.yml'
      - 'tests/igmm_control_kind_fixture.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stable v1.9.36 then JSONExport Delay5s layer
        run: |
          python3 .github/scripts/apply_hfamap_v1936_chain.py
          cp hfamap/src/HFAMapLegacy.m /tmp/HFAMapLegacy.v1936.m
          cp hfamap/src/HFAMapPatchExecutionTrace.m /tmp/HFAMapPatchExecutionTrace.v1936.m
          python3 .github/scripts/hfamap_v19361_json_export.py
          git diff --check

      - name: Verify parser core and exact startup-delay delta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def fn(text, signature):
              start=text.index(signature); brace=text.index('{', start); depth=0
              for i in range(brace, len(text)):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0: return text[start:i+1]
              raise RuntimeError(signature)
          before=Path('/tmp/HFAMapLegacy.v1936.m').read_text()
          after=Path('hfamap/src/HFAMapLegacy.m').read_text()
          if fn(before,'static unsigned int run_full_scan(void)') != fn(after,'static unsigned int run_full_scan(void)'):
              raise SystemExit('v1.9.36 protected run_full_scan changed')
          before_ctor=fn(before,'__attribute__((constructor)) static void init(void)')
          after_ctor=fn(after,'__attribute__((constructor)) static void init(void)')
          added='class_addMethod(c,sel_registerName("hfaDelayedStart:"),(IMP)hfaDelayedStart,"v@:@");'
          old_timer='if(t&&gTarget)M5(id,(id)t,"scheduledTimerWithTimeInterval:target:selector:userInfo:repeats:",double,.5,id,gTarget,SEL,sel_registerName("tick:"),id,(id)0,BOOL,1);'
          new_timer='if(t&&gTarget)M5(id,(id)t,"scheduledTimerWithTimeInterval:target:selector:userInfo:repeats:",double,5.0,id,gTarget,SEL,sel_registerName("hfaDelayedStart:"),id,(id)0,BOOL,0);'
          if after_ctor.count(added) != 1 or after_ctor.count(new_timer) != 1:
              raise SystemExit('expected exact 5-second constructor delta missing')
          normalized=after_ctor.replace(added,'',1).replace(new_timer,old_timer,1)
          if normalized != before_ctor:
              raise SystemExit('constructor changed beyond intentional 5-second startup delay')
          before_trace=Path('/tmp/HFAMapPatchExecutionTrace.v1936.m').read_text()
          after_trace=Path('hfamap/src/HFAMapPatchExecutionTrace.m').read_text()
          if before_trace != after_trace:
              raise SystemExit('v1.9.36 trace/resolver core changed')
          print('scan/resolver preserved; constructor delta is exactly Delay5s bootstrap')
          PY

      - name: Verify delay and analysis-only invariants
        run: |
          set -euo pipefail
          grep -q 'HFAMapJSONExportLatest' hfamap/src/HFAMapLegacy.m
          grep -q 'HFAMap v1.9.36.5 JSON Export Delay5s' hfamap/src/HFAMapLegacy.m
          grep -q 'static void hfaDelayedStart' hfamap/src/HFAMapLegacy.m
          grep -q 'double,5.0,id,gTarget,SEL,sel_registerName("hfaDelayedStart:")' hfamap/src/HFAMapLegacy.m
          grep -q 'double,.5,id,self,SEL,sel_registerName("tick:")' hfamap/src/HFAMapLegacy.m
          grep -q 'com.hfa.menu.analysis/v1' hfamap/src/HFAMapJSONExport.m
          grep -q 'analysisOnly' hfamap/src/HFAMapJSONExport.m
          grep -q 'normalizedExecutionPrimitive' hfamap/src/HFAMapJSONExport.m
          grep -q 'normalizedCanonicalReason' hfamap/src/HFAMapJSONExport.m
          grep -q 'runtime-action-not-static-bytes' hfamap/src/HFAMapJSONExport.m
          grep -q 'targetIdentities' hfamap/src/HFAMapJSONExport.m
          grep -q 'HFAMapUniversal v1.9.36.5 JSONExport Delay5s' hfamap/src/HFAMapJSONExport.m
          grep -q 'HFAMapJSONExport.m' hfamap/Makefile
          if grep -Eq 'DobbyHook|libdobby|HFAPatchConsumer|HFAPatchPlayback.command|runtime takeover|RUNTIME-TAKEOVER' hfamap/src/HFAMapJSONExport.m hfamap/Makefile; then
            echo 'forbidden playback/runtime dependency found'; exit 1
          fi
          if grep -q '__attribute__((constructor))' hfamap/src/HFAMapJSONExport.m; then
            echo 'JSON exporter must not add a constructor'; exit 1
          fi

      - name: Verify WayOfKings evidence normalization fixture
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          fixture=json.loads(Path('tests/igmm_control_kind_fixture.json').read_text())
          by_title={f['title']:f for f in fixture['features']}
          assert by_title['Damage Multiplier']['type']=='modtext'
          assert by_title['Defence Multiplier']['type']=='modtext'
          assert by_title['God Mode']['type']=='customSwitch'
          assert by_title['Debug Menu']['type']=='kTypeButton'
          source=Path('hfamap/src/HFAMapJSONExport.m').read_text()
          assert '[type isEqualToString:@"kTypeButton"]' in source
          assert '[implementationKind isEqualToString:@"buttonBlock"]' in source
          assert 'return @"runtimeAction";' in source
          assert 'record[@"normalizedCanonicalReason"]' in source
          assert 'runtime-action-not-static-bytes' in source
          print('normalization behavior preserved')
          PY

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build HFAMapUniversal v1.9.36.5 Delay5s
        run: |
          set -euo pipefail
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out='dist/HFAMapUniversal_v1.9.36.5_JSONExport_Delay5s.dylib'
          cp .theos/obj/HFAMapUniversal.dylib "$out"
          file "$out"
          shasum -a 256 "$out" | tee dist/SHA256_v1.9.36.5.txt
          strings "$out" > dist/strings_v1.9.36.5.txt
          grep -q 'HFAMap v1.9.36.5 JSON Export Delay5s' dist/strings_v1.9.36.5.txt
          grep -q 'HFAMapUniversal v1.9.36.5 JSONExport Delay5s' dist/strings_v1.9.36.5.txt
          grep -q 'hfaDelayedStart:' dist/strings_v1.9.36.5.txt
          grep -q 'com.hfa.menu.analysis/v1' dist/strings_v1.9.36.5.txt
          grep -q 'normalizedCanonicalReason' dist/strings_v1.9.36.5.txt
          nm -g "$out" > dist/nm_global_v1.9.36.5.txt
          nm -u "$out" > dist/nm_undefined_v1.9.36.5.txt
          if grep -Eq '_Dobby(Hook|Destroy)' dist/nm_global_v1.9.36.5.txt dist/nm_undefined_v1.9.36.5.txt; then
            echo 'Dobby symbol leaked into pure parser build'; exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v1.9.36.5-JSONExport-Delay5s
          path: |
            hfamap/dist/HFAMapUniversal_v1.9.36.5_JSONExport_Delay5s.dylib
            hfamap/dist/SHA256_v1.9.36.5.txt
          if-no-files-found: error
