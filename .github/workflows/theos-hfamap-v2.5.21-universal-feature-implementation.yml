name: HFAMap v2.5.21 Universal Feature Implementation

on:
  push:
    branches:
      - feature/hfamap-v2.5.21-universal-feature-implementation
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - '.github/workflows/theos-hfamap-v2.5.21-universal-feature-implementation.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tests/*.py
      - name: Generate and check v2.5.21 invariants
        run: |
          set -euo pipefail
          python3 hfamap/tools/generate_v2519_loaded_safe.py
          python3 hfamap/tools/generate_v2519_sender_safe.py
          python3 hfamap/tools/generate_v2520_integration.py
          python3 hfamap/tools/generate_v25201_feature_ownership_cache.py
          python3 hfamap/tools/generate_v25201_inventory_cache.py
          python3 hfamap/tools/generate_v25201_build_identity.py
          python3 hfamap/tools/generate_v2521_async_enrichment.py
          python3 hfamap/tools/generate_v2521_il2cpp_deadline.py
          test -f hfamap/src/HFAMapBundleRootScanner2521.mm
          test -f hfamap/src/HFAIL2CPPMethodIndex2521.mm
          test -f hfamap/src/HFAIL2CPPMethodRangeIndex2521.mm
          grep -q 'ASYNC-POST-UI-FEATURE-IMPLEMENTATION-ENRICHMENT' hfamap/src/HFAMapBundleRootScanner2521.mm
          grep -q 'uiBlocking' hfamap/src/HFAMapBundleRootScanner2521.mm
          grep -q 'timeIntervalSince1970 > deadline' hfamap/src/HFAIL2CPPMethodIndex2521.mm
          grep -q 'timeIntervalSince1970 > deadline' hfamap/src/HFAIL2CPPMethodRangeIndex2521.mm
          ! grep -q 'DobbyHook' hfamap/src/HFAMapBundleRootScanner2521.mm
      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.5.21-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib hfamap/dist/v2.5.21-dev/HFAMapUniversal-v2.5.21-dev.dylib
          out=hfamap/dist/v2.5.21-dev/HFAMapUniversal-v2.5.21-dev.dylib
          strings "$out" > "$RUNNER_TEMP/hfamap2521.strings"
          file "$out" | grep -q arm64
          grep -q '2.5.21-dev-universal-feature-implementation' "$RUNNER_TEMP/hfamap2521.strings"
          grep -q 'READ-ONLY-FAST-UI-ASYNC-UNIVERSAL-FEATURE-IMPLEMENTATION' "$RUNNER_TEMP/hfamap2521.strings"
          shasum -a 256 "$out" | tee hfamap/dist/v2.5.21-dev/SHA256SUMS.txt
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.5.21-UniversalFeatureImplementation
          path: |
            hfamap/dist/v2.5.21-dev/HFAMapUniversal-v2.5.21-dev.dylib
            hfamap/dist/v2.5.21-dev/SHA256SUMS.txt
          if-no-files-found: error
