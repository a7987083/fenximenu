name: HFARuntimeAnalyzer v0.3.8 DownstreamConsumerResolver

on:
  push:
    branches:
      - feature/hfaruntime-v0.3.8-downstream-consumer-resolver
    paths:
      - 'hfamap/**'
      - '.github/scripts/**'
      - '.github/workflows/theos-hfamap-runtime-analyzer-v038.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate baseline plus v0.3.8
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_hfamap_v1936_chain.py
          python3 .github/scripts/hfamap_v19361_json_export.py
          python3 .github/scripts/hfamap_v19367_dynamic_apply_local.py
          python3 .github/scripts/hfamap_v19367_secret_callgraph_local.py
          python3 .github/scripts/hfamap_v19367_app_local_menu_resolver.py
          python3 .github/scripts/hfamap_v19367_ui_cleanup.py
          python3 .github/scripts/hfamap_v19367_trace_cleanup.py
          python3 .github/scripts/hfamap_v19367_generic_cleanup.py
          python3 .github/scripts/hfamap_v19368_family_menu_resolver.py
          python3 .github/scripts/apply_hfamap_v19370.py
          python3 .github/scripts/hfamap_v19371_5m_dispatcher_resolver.py
          python3 .github/scripts/hfamap_v19372_5m_dual_backend_fix.py
          python3 .github/scripts/hfamap_v19373_app_local_dylib_discovery_v2.py
          python3 .github/scripts/hfamap_v19374_prepare_patch.py
          python3 .github/scripts/hfamap_v19374_manual_candidate_selection.py
          python3 .github/scripts/hfamap_v19374_finalize_markers.py
          python3 .github/scripts/hfamap_v19375_loaded_macho_dependency_discovery.py
          python3 .github/scripts/hfamap_v19376_loaded_image_fingerprint.py
          python3 .github/scripts/hfamap_v19377_two_stage_class_metadata_scan.py
          python3 .github/scripts/hfamap_v19378_structural_relation_expansion.py
          python3 .github/scripts/hfamap_v19379_complete_feature_export.py
          python3 .github/scripts/hfamap_v193710_unified_feature_model.py
          python3 .github/scripts/hfamap_v193710_earntodie_verified_profile.py
          python3 .github/scripts/hfamap_runtime_analyzer_v02.py
          python3 .github/scripts/hfamap_runtime_analyzer_v02_fix1.py
          python3 .github/scripts/hfamap_runtime_analyzer_v03.py
          python3 .github/scripts/hfamap_runtime_analyzer_v03_fix1.py
          python3 .github/scripts/hfamap_runtime_analyzer_v032_auto_backend.py
          python3 .github/scripts/hfamap_runtime_analyzer_v032_output_layout.py
          python3 .github/scripts/hfamap_runtime_analyzer_v032_generic_output_fix.py
          python3 .github/scripts/hfamap_runtime_analyzer_v032_safe_discovery_paths.py
          python3 .github/scripts/hfamap_runtime_analyzer_v033_static_parity.py
          python3 .github/scripts/hfamap_runtime_analyzer_v033_fix1.py
          python3 .github/scripts/hfamap_runtime_analyzer_v034_semantic_backend.py
          python3 .github/scripts/hfamap_runtime_analyzer_v034_compile_fix.py
          python3 .github/scripts/hfamap_runtime_analyzer_v0341_stability.py
          python3 .github/scripts/hfamap_runtime_analyzer_v0342_cfg_reachability.py
          python3 .github/scripts/hfamap_runtime_analyzer_v035_semantic_coverage.py
          python3 .github/scripts/hfamap_runtime_analyzer_v035_feature_binding.py
          python3 .github/scripts/hfamap_runtime_analyzer_v035_action_fallback_conflicts.py
          python3 .github/scripts/hfamap_runtime_analyzer_v035_compile_fix.py
          python3 .github/scripts/hfamap_runtime_analyzer_v036_transform_flow.py
          python3 .github/scripts/hfamap_runtime_analyzer_v036_runtime_binding.py
          python3 .github/scripts/hfamap_runtime_analyzer_v037_semantic_nodes_state.py
          python3 .github/scripts/hfamap_runtime_analyzer_v037_consumer_binding.py
          python3 .github/scripts/hfamap_runtime_analyzer_v038_dispatcher_downstream.py
          python3 .github/scripts/hfamap_runtime_analyzer_v038_runtime_consumer.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hfamap/src/HFAMapRuntimeAnalyzerV02.m')
          p.write_text(p.read_text().replace('static NSArray *HFAV02Hints(uintptr_t function,HFAV02Layout l)','static __attribute__((unused)) NSArray *HFAV02Hints(uintptr_t function,HFAV02Layout l)',1))
          app=Path('hfamap/src/HFAMapAppLocalResolver.m')
          app.write_text(app.read_text().replace('static NSString *HFAAppLocalResolveInstallName(','static __attribute__((unused)) NSString *HFAAppLocalResolveInstallName(',1))
          PY
          git diff --check

      - name: Verify v0.3.8 generated sources
        run: |
          set -euo pipefail
          check(){ file="$1"; needle="$2"; grep -Fq "$needle" "$file" || { echo "MISSING [$needle] in $file"; exit 1; }; }
          SRC=hfamap/src/HFAMapRuntimeAnalyzerV02.m
          SEM=hfamap/src/HFARuntimeSemanticAnalyzer.m
          DIS=hfamap/src/HFAMap5MDispatcherResolver.m
          UI=hfamap/src/HFAMapCyberUI.m
          check "$DIS" 'observerRegistrations'
          check "$DIS" 'addObserver:selector:name:object:'
          check "$DIS" 'observerCallbackResolved'
          check "$DIS" 'HFA5MDispatcherEvidenceReadiness'
          check "$SRC" 'HFAV038EvidenceSnapshot'
          check "$SRC" 'HFAV038DownstreamSemanticEvidence'
          check "$SRC" 'HFAV038ClassStateIndex'
          check "$SRC" 'HFAV038DownstreamStateBindings'
          check "$SRC" 'downstream-shared-state'
          check "$SRC" '[V038-DOWNSTREAM-BIND]'
          check "$SRC" '[V038-EVIDENCE-PENDING]'
          check "$SRC" 'branchOutcome'
          check "$SRC" 'HFAMap_RuntimeAnalyzer_v038.json'
          check "$SEM" 'HFAMap_RuntimeAnalyzer_v038_stage.log'
          check "$SRC" 'com.hfa.runtime-analyzer/v0.3.8'
          check "$SRC" 'HFAEnableIL2CPPEnrichmentV038'
          check "$UI" 'HFAMap RuntimeAnalyzer v0.3.8 DownstreamConsumerResolver'
          check "$SRC" 'disabled-by-default'
          grep -Fq '0x2D98AC8' .github/scripts/hfamap_v193710_earntodie_verified_profile.py
          grep -Fq '0x2D9887C' .github/scripts/hfamap_v193710_earntodie_verified_profile.py
          if grep -Eq '0x2D98AC8|0x2D9887C|0x2E25904' .github/scripts/hfamap_runtime_analyzer_v038_*.py; then echo 'FIXED RVA LEAKED INTO V038 GENERIC LAYER'; exit 1; fi
          if grep -R -Fq 'Documents/HFAMap_' hfamap/src --include='*.m' --include='*.mm'; then echo 'DIRECT OUTPUT PATH REGRESSION'; exit 1; fi

      - name: Verify v0.3.8 scripts
        run: |
          python3 -m py_compile .github/scripts/hfamap_runtime_analyzer_v038_dispatcher_downstream.py .github/scripts/hfamap_runtime_analyzer_v038_runtime_consumer.py

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build v0.3.8
        run: |
          set -euo pipefail
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out='dist/HFARuntimeAnalyzer-v0.3.8-DownstreamConsumerResolver.dylib'
          cp .theos/obj/HFAMapUniversal.dylib "$out"
          file "$out"
          shasum -a 256 "$out" | tee dist/SHA256_HFARuntimeAnalyzer-v0.3.8-DownstreamConsumerResolver.txt
          strings "$out" > dist/strings_v038.txt
          grep -q 'V038-DOWNSTREAM-BIND' dist/strings_v038.txt
          grep -q 'V038-EVIDENCE-PENDING' dist/strings_v038.txt
          grep -q 'observerCallbackResolved' dist/strings_v038.txt
          grep -q 'receiver-consumer' dist/strings_v038.txt
          grep -q 'downstream-shared-state' dist/strings_v038.txt
          grep -q 'branchOutcome' dist/strings_v038.txt
          grep -q 'HFAMap_RuntimeAnalyzer_v038.json' dist/strings_v038.txt
          grep -Fxq 'com.hfa.runtime-analyzer/v0.3.8' dist/strings_v038.txt
          grep -q 'HFAMap RuntimeAnalyzer v0.3.8 DownstreamConsumerResolver' dist/strings_v038.txt
          grep -q 'HFAMap_%@' dist/strings_v038.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HFARuntimeAnalyzer-v0.3.8-DownstreamConsumerResolver
          path: |
            hfamap/dist/HFARuntimeAnalyzer-v0.3.8-DownstreamConsumerResolver.dylib
            hfamap/dist/SHA256_HFARuntimeAnalyzer-v0.3.8-DownstreamConsumerResolver.txt
          if-no-files-found: error
