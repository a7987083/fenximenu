name: HFAMap v2.5.19 Stability Verified Helper Return

on:
  push:
    branches:
      - feature/hfamap-v2.5.19-stability-verified-helper-return
    paths:
      - 'hfamap/**'
      - 'tests/**'
      - '.github/workflows/theos-hfamap-v2.5.19-stability-verified.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile tests/*.py
      - name: Generate and check v2.5.19 invariants
        run: |
          set -euo pipefail
          python3 hfamap/tools/generate_v2519_loaded_safe.py
          python3 hfamap/tools/generate_v2519_sender_safe.py
          test -f hfamap/src/HFAMapLoadedDylibEvidenceResolver2519.mm
          test -f hfamap/src/HFAMapSenderDerivedProvenanceResolver2519.mm
          ! grep -q 'object_getClass((id)(uintptr_t)value)' hfamap/src/HFAMapLoadedDylibEvidenceResolver2519.mm
          grep -q 'DISABLED-UNTRUSTED-GLOBAL-POINTER-FAIL-CLOSED' hfamap/src/HFAMapLoadedDylibEvidenceResolver2519.mm
          grep -q 'analysisTruncated' hfamap/src/HFAMapSenderDerivedProvenanceResolver2519.mm
          grep -q 'provenanceConfidence' hfamap/src/HFAMapSenderDerivedProvenanceResolver2519.mm
          grep -q 'r.confidence != HFASDConfidenceCandidate' hfamap/src/HFAMapSenderDerivedProvenanceResolver2519.mm
          ! grep -q '0xB96A54' hfamap/src/HFAMapSenderDerivedProvenanceResolver2519.mm
          ! grep -q '0xB96B2C' hfamap/src/HFAMapSenderDerivedProvenanceResolver2519.mm
      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
      - name: Build arm64 dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make -C hfamap clean
          make -C hfamap FINALPACKAGE=1
          mkdir -p hfamap/dist/v2.5.19-dev
          cp hfamap/.theos/obj/HFAMapUniversal.dylib hfamap/dist/v2.5.19-dev/HFAMapUniversal-v2.5.19-dev.dylib
          out=hfamap/dist/v2.5.19-dev/HFAMapUniversal-v2.5.19-dev.dylib
          strings "$out" > "$RUNNER_TEMP/hfamap2519.strings"
          file "$out" | grep -q arm64
          grep -q '2.5.19-dev-stability-verified-helper-return' "$RUNNER_TEMP/hfamap2519.strings"
          grep -q 'DISABLED-UNTRUSTED-GLOBAL-POINTER-FAIL-CLOSED' "$RUNNER_TEMP/hfamap2519.strings"
          grep -q 'READ-ONLY-FAIL-CLOSED-VERIFIED-HELPER-RETURN-PROVENANCE' "$RUNNER_TEMP/hfamap2519.strings"
          shasum -a 256 "$out" | tee hfamap/dist/v2.5.19-dev/SHA256SUMS.txt
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v2.5.19-StabilityVerifiedHelperReturn
          path: |
            hfamap/dist/v2.5.19-dev/HFAMapUniversal-v2.5.19-dev.dylib
            hfamap/dist/v2.5.19-dev/SHA256SUMS.txt
          if-no-files-found: error
